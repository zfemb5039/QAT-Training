 id:'fc1', title:'What QAT is, and how it is organised', minutes:7,
 body:[
  {t:'p',cls:'lede',c:'QAT is a cloud-based tool for country-led forecasting and supply planning, built for any health commodity. It replaced Quantimed for forecasting and PipeLine for supply planning, and it is a recognised digital public good.'},
  {t:'p',c:'The two modules arrived separately. Supply Planning launched in December 2020; Forecasting followed in June 2022. As of May 2026, 45 countries had been trained on QAT, 34 of them on both modules.'},
  {t:'p',c:'Before any of the arithmetic makes sense, it helps to know how QAT organises data, because nearly every setting you will touch lives at one of these levels.'},
  {t:'table',head:['Level','What it is'],rows:[
    ['Realm','A world of shared master data — product catalogue, funder names, procurement agent names. The Global Health Realm is the one in use today.'],
    ['Program','One country, one or more technical areas, one region, one organisation. A program is the equivalent of a PipeLine supply plan database, or a Quantimed forecast dataset.'],
    ['Region','Sub-national levels inside a program. If you plan nationally, leave it as national or central.'],
    ['Version','A saved state of a program. The copy on your machine is the local version; the copy on the server is read-only.']
  ]},
  {t:'h',c:'Working offline'},
  {t:'p',c:'QAT is a progressive web app, so you can work without a connection — but only after downloading the program to your computer while online. Master data syncs when you log in online or when you sync manually. Full forecast and supply plan data is a deliberate download-then-upload cycle, not a background sync.'},
  {t:'note',b:'Local and server versions',c:'On both the forecasting and supply planning screens you will see your Local version, which is editable, and the Server version, which is the latest upload and is view-only. Edits always happen locally and are uploaded as a new version.'},
  {t:'p',c:'If something is wrong with master data — a missing product, a funder that should exist, a user role — that is a ticket to a realm or application administrator, not something you fix inside your own program.'}
 ],
 exercises:[
  {type:'mcq', tag:'Recall',
   q:'Which combination defines a QAT program?',
   options:['One product, one funder, one year','One country, one or more technical areas, one region, one organisation','One realm and one procurement agent','One forecast and one supply plan'],
   answer:1,
   explain:'A program is scoped by country, technical area(s), region and organisation — usually the MOH at national level. It is the direct equivalent of a PipeLine supply plan database.'},
  {type:'classify', tag:'Sort',
   q:'Sort each item into where it is controlled.',
   buckets:[{id:'master',label:'Master data — raise a ticket'},{id:'prog',label:'Program settings — you or your admin'}],
   items:[
    {text:'Product catalogue',bucket:'master'},
    {text:'Procurement agent names',bucket:'master'},
    {text:'Minimum stock level',bucket:'prog'},
    {text:'Reorder interval',bucket:'prog'},
    {text:'Funder names',bucket:'master'},
    {text:'AMC calculation window',bucket:'prog'}
   ],
   explain:'Master data is shared across everyone in the realm, so changes go through a ticket. Planning parameters belong to your program and are set by the program administrator.'}
 ]
},
{
 id:'fc2', title:'Units: forecasting, planning, reporting, equivalency', minutes:7,
 body:[
  {t:'p',cls:'lede',c:'QAT keeps four different units for the same product. Mixing them up is one of the most common sources of a quantification that comes out wildly wrong, and it matters from the first forecast onward.'},
  {t:'table',head:['Unit','What it is'],rows:[
   ['Forecasting unit (FU)','The smallest unit used when forecasting demand — tablets, tests, vials. Always smaller than or equal to the planning unit.'],
   ['Planning unit (PU)','The unit you plan and order in — a bottle of 30 tablets, a 10x10 blister pack.'],
   ['Alternate reporting unit (ARU)','The unit your country actually reports consumption or stock in, with a conversion multiplier to the planning unit.'],
   ['Equivalency unit (EU)','A standardised unit that lets different strengths or pack sizes be compared and aggregated — malaria treatments, ARV patient-months, couple-years of protection.']
  ]},
  {t:'p',c:'Forecasts are built in forecasting units because that is the level a clinical assumption lives at: a patient takes tablets, not cartons. The conversion to planning units happens on the way into the supply plan.'},
  {t:'h',c:'ARU conversion'},
  {t:'p',c:'Say the planning unit is a bottle of 30 tablets, but the warehouse reports in boxes of 20 bottles. The multiplier is 20. A reported inventory of 100 boxes becomes 2,000 bottles in the plan. On the supply planning screen you can switch the whole table and graph to the ARU view, and every value converts.'},
  {t:'widget',kind:'units'},
  {t:'note',b:'Purpose of equivalency units',c:'You cannot aggregate two different pack sizes directly. Equivalency units are what let a report show one national curve across products that are not the same SKU. ARUs cannot be used together with EUs.'}
 ],
 exercises:[
  {type:'num', tag:'Calculate',
   q:'The planning unit is a bottle of 30 tablets. Stock is reported in boxes of 20 bottles, and the warehouse reports 340 boxes. How many planning units is that?',
   answer:6800, tol:0, unit:'bottles',
   hint:'Multiply the reported quantity by the conversion factor.',
   explain:'340 boxes x 20 bottles = 6,800 planning units. Enter data in whichever unit your staff actually count in and let QAT convert — re-keying conversions by hand is where errors creep in.'},
  {type:'mcq', tag:'Recall',
   q:'Which statement is always true?',
   options:['The forecasting unit is larger than the planning unit','The planning unit is smaller than or equal to the forecasting unit','The forecasting unit is smaller than or equal to the planning unit','The alternate reporting unit equals the planning unit'],
   answer:2,
   explain:'FU is always the smallest — you forecast in tablets and plan in packs, never the other way round.'}
 ]
},
{
 id:'fc3', title:'Two routes to a forecast', minutes:8,
 body:[
  {t:'p',cls:'lede',c:'The forecasting module answers how much will be needed. QAT offers two routes to that answer, and a planning unit can use either — or both, so you can compare them.'},
  {t:'table',head:['Approach','When it fits'],rows:[
   ['Consumption-based forecast','There is usable historical consumption. QAT extrapolates it forward using linear and non-linear methods.'],
   ['Tree forecast','There is no reliable consumption history, or demand is driven by something else — demographics, morbidity, service statistics. A tree converts those inputs into commodity quantities.']
  ]},
  {t:'h',c:'Trees, templates and usage rates'},
  {t:'p',c:'A forecasting tree is a flexible structure that turns a population or service number into products. Tree templates are pre-built structures you download and adapt to your context; usage templates are pre-defined rates of use for specific products that can be reused across trees and programs. Both exist so that forty countries are not each inventing the same ARV regimen branch from scratch.'},
  {t:'p',c:'When you set a usage rate you choose whether the product is used continuously — unending, like a daily ARV — or discretely. A discrete product needs a period of use, unless it is single use, in which case no period applies.'},
  {t:'h',c:'Comparing forecast versions'},
  {t:'p',c:'The point of the module is comparison. Build a consumption-based version and a tree-based version of the same product, and compare them. A material difference indicates either that the service data disagrees with what is being issued, or that the consumption history is distorted. Either finding should be resolved before a version is selected.'},
  {t:'widget',kind:'tree'},
  {t:'note',b:'Recording assumptions',c:'Record the assumptions behind a tree — coverage rates, adherence, seasonality — where the next planner can find them. A quantification that cannot explain itself six months later has to be redone from scratch.'}
 ],
 exercises:[
  {type:'mcq', tag:'Judgement',
   q:'A country is introducing a product that has never been issued before. Which approach fits?',
   options:['Consumption-based forecast using a short window','A tree forecast built from morbidity or service data','Copy the previous product\u2019s consumption','Wait for six months of actuals'],
   answer:1,
   explain:'With no consumption history there is nothing to extrapolate. A tree converts the underlying driver — cases, patients, services — into commodity quantities.'},
  {type:'mcq', tag:'Recall',
   q:'A product is used for a fixed 14-day course. How is it defined on the tree?',
   options:['Continuous use','Discrete use with a period specified','Discrete use, single use','Continuous use with a multiplier'],
   answer:1,
   explain:'Discrete use with the period of use specified. Single use is the special case where no period is needed.'},
  {type:'mcq', tag:'Judgement',
   q:'Your tree forecast is 40% higher than your consumption-based forecast for the same product. What is the right first move?',
   options:['Average the two','Take the tree forecast, since it reflects need rather than supply','Take the consumption forecast, since it reflects reality','Work out which assumption drives the gap before choosing either'],
   answer:3,
   explain:'The difference between the two forecasts is itself a finding. It usually indicates either that the service data overstates coverage, or that consumption was suppressed by stockouts. Averaging the two conceals the cause; selecting one without investigating it is not supportable.'}
 ]
},
{
 id:'fc4', title:'Extrapolation methods', minutes:8,
 body:[
  {t:'p',cls:'lede',c:'When you do have consumption history, QAT can project it forward several ways. Having several is the point — you run them to compare, not to find the one true method.'},
  {t:'table',head:['Method','What it captures'],rows:[
   ['Linear extrapolation','A straight trend. Simple and transparent; badly wrong if demand is seasonal.'],
   ['Non-linear extrapolation','Curved growth or decline in the history.'],
   ['ARIMA','Auto-regressive integrated moving average — a time-series method that fits trends and patterns in the history.'],
   ['Triple exponential smoothing (Holt-Winters)','Level, trend and seasonality together. The one to reach for when demand has a repeating annual shape.']
  ]},
  {t:'h',c:'Selecting a method'},
  {t:'p',c:'Run more than one, look at the shapes against the actuals, and check the error metrics. A method that fits the history beautifully but produces an implausible forward curve is not the winner — plot it out and sanity-check the far end. Two years of history flattered by a clever fit will still send you a year of stock you cannot use.'},
  {t:'widget',kind:'extrap'},
  {t:'note',b:'Data quality before extrapolation',c:'Extrapolation takes whatever pattern is in the data. Stockout periods, campaign spikes and a guideline change all read as signal. Clean or flag these periods before extrapolating, or the projection will carry the distortion forward.'},
  {t:'widget',kind:'stockout'}
 ],
 exercises:[
  {type:'classify', tag:'Match',
   q:'Match each demand pattern to the method built for it.',
   buckets:[{id:'lin',label:'Linear extrapolation'},{id:'tes',label:'Triple exponential smoothing'}],
   items:[
    {text:'Steady growth, no seasonality',bucket:'lin'},
    {text:'Peaks every year in the same three months',bucket:'tes'},
    {text:'Flat demand with a slow upward drift',bucket:'lin'},
    {text:'Rainy-season malaria caseload',bucket:'tes'}
   ],
   explain:'Holt-Winters models level, trend and seasonality together, which is exactly the shape of a transmission-season commodity. Linear is the honest choice when there is a trend and nothing else.'},
  {type:'mcq', tag:'Judgement',
   q:'A method fits the last three years almost perfectly but projects consumption doubling within twelve months. What should you do?',
   options:['Use it — the fit statistics are the evidence','Check the forward curve against what is clinically plausible before using it','Switch to linear automatically','Extend the history until the fit worsens'],
   answer:1,
   explain:'Fit measures how well a method explains the past. It says nothing about whether the projection is sensible. An implausible forward curve is a reason to reject a method regardless of its error metrics.'}
 ]
},
{
 id:'fc5', title:'Measuring forecast error', minutes:9,
 body:[
  {t:'p',cls:'lede',c:'Comparing forecast versions needs a number, and QAT reports several. They disagree on purpose, and the disagreement is informative.'},
  {t:'table',head:['Metric','What it measures'],rows:[
   ['MAPE','Mean absolute percentage error — the average of each period\u2019s percentage error, every period weighted equally.'],
   ['WAPE','Weighted absolute percentage error — total absolute error as a percentage of total actual demand, so high-volume periods dominate.'],
   ['RMSE','Root mean squared error — in units, and punishes large misses far more than small ones.'],
   ['MSE','Mean squared error — the same idea before taking the square root.']
  ]},
  {t:'h',c:'Comparing MAPE and WAPE'},
  {t:'p',c:'MAPE treats a month with 50 units the same as a month with 50,000. A 40% miss on a tiny month can drag the headline number badly even though the absolute error is trivial. WAPE weights by volume, so it tells you how much product you got wrong rather than how often you were off.'},
  {t:'p',c:'Try it below. The two forecast versions are close on some metrics and not others, and clicking a month out — the way you would exclude a stockout period — moves them by different amounts.'},
  {t:'widget',kind:'error'},
  {t:'note',b:'Interpreting the two metrics together',c:'If MAPE is poor and WAPE is fine, your errors are concentrated in low-volume periods. If WAPE is poor, the misses are where the money is.'}
 ],
 exercises:[
  {type:'num', tag:'Calculate',
   q:'Three months. Actuals: 1,000 / 2,000 / 500. Forecasts: 1,100 / 1,800 / 600. What is the MAPE, as a percentage?',
   answer:13.33, tol:0.4, unit:'%',
   hint:'Percentage error for each month, then the plain average of the three.',
   explain:'Errors are 10%, 10% and 20%, so MAPE = 13.3%. Each month counts equally regardless of its size.'},
  {type:'num', tag:'Calculate',
   q:'Same three months. What is the WAPE, as a percentage?',
   answer:11.43, tol:0.4, unit:'%',
   hint:'Total absolute error divided by total actual demand.',
   explain:'Absolute errors total 400 against actual demand of 3,500, so WAPE = 11.4%. It is lower than MAPE because the worst percentage miss was on the smallest month — exactly the distinction the two metrics exist to expose.'},
  {type:'mcq', tag:'Apply',
   q:'Version A has the lower MAPE; version B has the lower WAPE. You are sizing a year of procurement. Which is the more relevant number?',
   options:['MAPE, because it is the standard metric','WAPE, because it weights the months where the volume is','Whichever is lower','Neither — use RMSE'],
   answer:1,
   explain:'Procurement value tracks volume. A version that is accurate in high-volume months and less accurate in low-volume months carries a lower financial consequence than the reverse, although MAPE would rank the second version higher.'}
 ]
},
{
 id:'fc6', title:'From forecast into the supply plan', minutes:7,
 body:[
  {t:'p',cls:'lede',c:'A forecast is only useful once it is sitting under a supply plan. The handover is where unit conversion and version discipline matter.'},
  {t:'list',items:[
   'Build and compare forecast versions in the forecasting module; pick one.',
   'Quantities convert from forecasting units to planning units on the way through.',
   'The chosen forecast becomes the forecast consumption line in the supply plan — the purple italic figures.',
   'Actual consumption, once entered, displaces the forecast for that month.'
  ]},
  {t:'h',c:'Version control'},
  {t:'p',c:'Both modules version the same way: download a program, work locally, upload when you are done, which creates a new version on the server. Anyone else sees the server version until you upload. Agreeing who holds the pen during a quantification workshop saves a great deal of reconciliation afterwards.'},
  {t:'note',b:'The QAT problem list',c:'QPL flags data issues, inconsistencies and warnings that would affect a forecast or a plan. Clear it before you present anything.'},
  {t:'p',c:'From here the second track picks up the story: what the supply planning module does with the forecast you just handed it.'}
 ],
 exercises:[
  {type:'mcq', tag:'Recall',
   q:'You entered actual consumption for March, and the forecast for March was different. What shows on the supply planning screen?',
   options:['The forecast, in purple italics','The actual, in plain black','Both, in separate rows','Whichever is higher'],
   answer:1,
   explain:'For a single-region program the actual displaces the forecast once it exists. The greater-of rule applies only to multi-region programs aggregating across regions.'},
  {type:'seq', tag:'Sequence',
   q:'Put the workflow in order.',
   items:['Upload as a new version','Download the program while online','Build and compare forecast versions','Work locally on the supply plan'],
   order:[1,2,3,0],
   explain:'Download, forecast, plan, upload. QAT works offline by design, but only against a program you pulled down first.'}
 ]
}
];

const SP = [
{
 id:'sp1', title:'Reading the supply planning screen', minutes:9,
 body:[
  {t:'p',cls:'lede',c:'The supply planning screen is where the big three come together: consumption, shipments and stock. It is a single screen, it is editable, and everything on it recalculates as you type.'},
  {t:'p',c:'You view one planning unit at a time — or its alternate reporting unit, which you can switch between. The table runs horizontally, eighteen months from whichever start month you pick, with the current month highlighted. Scroll left or right, or change the start month, to see further out.'},
  {t:'img',src:'screen',alt:'The QAT supply planning screen showing the legend and the monthly table',
   cap:'The screen in full: planning unit settings and legend on top, the monthly table below. Note the two tabs — the local version is editable, the server version is the last upload and is read-only.'},
  {t:'h',c:'The legend'},
  {t:'p',c:'Everything you need to interpret the table is declared above it. The planning unit settings show the AMC window as months in past over months in future, the shelf life, and min, reorder interval and max. The colour keys tell you the rest.'},
  {t:'table',head:['What you see','What it means'],rows:[
   ['Bold value','An actual count — a real inventory record, not a projection'],
   ['Unbolded value','Projected'],
   ['Black consumption','Actual consumption'],
   ['Purple italic consumption','Forecast consumption'],
   ['Shipment cell colour','Which procurement agent; pale green means several in one month'],
   ['L in the corner','Local procurement'],
   ['Red flag','Emergency shipment'],
   ['Chain link','Linked to an ERP — those fields are not editable in QAT']
  ]},
  {t:'h',c:'Table rows'},
  {t:'p',c:'The top half is quantities and the bottom half is the interpretation.'},
  {t:'table',head:['Row','Notes'],rows:[
   ['Opening Balance','Last month\u2019s ending balance'],
   ['− Consumption','Actual where it exists, otherwise forecast'],
   ['+ Shipments','Expand with the + sign to see suggested, then a row per status'],
   ['+/− Total Adjustment','Expands into manual and automatic adjustments'],
   ['− Projected Expired Stock','Projected from the shelf life and batch dates'],
   ['Ending Balance','Carries into next month as the opening balance'],
   ['Months of Stock','Ending balance ÷ AMC, colour-coded against min and max'],
   ['AMC','The dynamic average, using the window shown in the legend'],
   ['Unmet Demand','What could not be consumed because stock was not there']
  ]},
  {t:'widget',kind:'plan'},
  {t:'note',b:'Recommended practice',c:'Collapse the sidebar so the table has room. And add a general note to each planning unit saying what the stock on hand actually covers — central warehouse only, or warehouses plus facilities. It shows in the legend, and it is the first question anyone reviewing your plan will ask.'},
  {t:'p',c:'Show Formulae in the top right reveals the calculation behind each row, and the whole screen exports to PDF or CSV.'}
 ],
 exercises:[
  {type:'mcq', tag:'Read the screen',
   q:'On the screen above, the opening balance for January is bold and the figure for October is not. What does that tell you?',
   options:['January is a larger number','January is an actual inventory count; October is projected',
            'January has been approved and October has not','October is in a different unit'],
   answer:1,
   explain:'Bold indicates that an actual count exists for that month. Unbolded values are projected forward from the last actual count. When reviewing a plan, identify the last bold month first, as everything after it is projection.'},
  {type:'classify', tag:'Sort',
   q:'Sort each row by which half of the table it sits in.',
   buckets:[{id:'qty',label:'Quantities (top half)'},{id:'read',label:'Interpretation (bottom half)'}],
   items:[
    {text:'Opening Balance',bucket:'qty'},
    {text:'Months of Stock',bucket:'read'},
    {text:'Projected Expired Stock',bucket:'qty'},
    {text:'AMC',bucket:'read'},
    {text:'Shipments',bucket:'qty'},
    {text:'Unmet Demand',bucket:'read'}
   ],
   explain:'The top half records quantities received and issued. The bottom half reports what those quantities mean: the consumption rate, the months of cover, and any demand that could not be met.'},
  {type:'mcq', tag:'Recall',
   q:'You are on the Server Supply Plan tab and try to change a shipment quantity. What happens?',
   options:['It saves straight to the server','Nothing — the server version is read-only',
            'It creates a new version automatically','It warns you and then saves locally'],
   answer:1,
   explain:'The server tab exists so you can compare your local edits against the last uploaded version. All editing happens on the local tab, and the server copy only changes when you upload.'}
 ]
},
{
 id:'sp2', title:'Reading the supply plan graph', minutes:9,
 body:[
  {t:'p',cls:'lede',c:'Below the table is the same data as a picture, and it uses two axes at once — quantity on the left, months of stock on the right. That is what lets it show a stock balance and a stock adequacy in one frame.'},
  {t:'img',src:'graph',alt:'The QAT supply plan graph with stock area, consumption line, shipment bars and months of stock',
   cap:'Grey area is stock. The red line is consumption, drawing it down. Coloured bars are shipments, pushing it up, with the colour showing status. The darker line above is months of stock, read against the right axis, between the two dashed min and max lines.'},
  {t:'p',c:'Read the elements in that order. The grey area declines at the rate of the consumption line, and each bar marks a shipment scheduled to interrupt that decline.'},
  {t:'table',head:['Element','Meaning'],rows:[
   ['Grey area','Stock on hand, left axis'],
   ['Red line with dots','Consumption — dots mark actual rather than forecast'],
   ['Vertical bars','Shipments, coloured by status: received, shipped and arrived, submitted and approved, on-hold, planned'],
   ['Orange triangle','Projected expired stock in that month'],
   ['Dark line','Months of stock, right axis'],
   ['Dashed lines','Min and max MOS']
  ]},
  {t:'note',b:'Hiding graph elements',c:'You can hide any element to declutter the picture. It changes nothing in the data or the calculations — useful when you are showing one thing to a room, but it does not make a problem go away.'},
  {t:'p',c:'The widget below is a working replica. Pick a month to read every row at once, the way hovering the real chart does.'},
  {t:'widget',kind:'qatgraph'}
 ],
 exercises:[
  {type:'mcq', tag:'Read the screen', img:'quizgraph',
   q:'In the graph above, which months have a planned shipment?',
   options:['March 23 and July 23','October 23 only','January 24 and May 24','August 23 and September 23'],
   answer:2,
   explain:'Planned shipments are shown as the palest blue bars, in January 24 and May 24. The darker bars earlier in the series represent received, shipped and arrived, and submitted and approved shipments, in increasing order of certainty.'},
  {type:'mcq', tag:'Read the screen', img:'quizgraph',
   q:'Which month shows projected expired stock?',
   options:['March 23','August 23','December 23','June 24'],
   answer:1,
   explain:'The orange triangle appears on August 23. Projected expiry results from an earlier over-order and appears on the plan in the month the stock is projected to expire.'},
  {type:'mcq', tag:'Read the screen', img:'quizgraph',
   q:'Which months are understocked — months of stock below the minimum?',
   options:['January 23 through June 23','March 23, July 23 and October 23',
            'September 23, December 23 and April 24','None — the plan stays in band all year'],
   answer:2,
   explain:'Read the months-of-stock line against the lower dashed line. It falls below the minimum in September 23, December 23 and April 24. The sawtooth pattern is expected: stock rises on receipt and declines between shipments.'},
  {type:'mcq', tag:'Read the screen', img:'quizgraph',
   q:'Which months have actual rather than forecast consumption?',
   options:['All eighteen months','January 23 through June 23','Only January 23','The last six months'],
   answer:1,
   explain:'The dots on the consumption line mark actual values and stop after June 23. Subsequent months are forecast. Because the AMC window extends two to three months forward, the forecast already affects the current month\u2019s stock status.'}
 ]
},
{
 id:'sp3', title:'AMC and months of stock', minutes:10,
 body:[
  {t:'p',cls:'lede',c:'Average monthly consumption is the denominator under almost everything else, and QAT calculates it differently from how most planners expect.'},
  {t:'eq',c:'Default AMC = mean of the 3 previous months, the current month, and 2 future months',
   note:'The legend shows the window as months in past / months in future. A program administrator can widen it to 12 months either side, so always read the legend rather than assuming the default.'},
  {t:'p',c:'Looking forward matters. Because future months are forecast rather than actual, a change in the forecast moves the AMC, which moves months of stock, which moves the stock status colour — before any real consumption has happened. That is intentional: it makes the plan respond to a coming change in demand rather than lagging it.'},
  {t:'note',b:'Missing is not zero',c:'A month with no consumption data inside the window is treated as null and dropped from the average, never counted as zero. For a newly added product, past months are simply ignored until data exists. A zero would reduce the AMC and consequently every order quantity sized from it.'},
  {t:'p',c:'Widen the window below and watch what happens when it reaches the month with no data.'},
  {t:'widget',kind:'amc'},
  {t:'widget',kind:'region'},
  {t:'eq',c:'Months of stock = ending balance ÷ AMC',
   note:'Recalculated for every month of the horizon, not once for the plan.'},
  {t:'p',c:'MOS is what makes forty products comparable on one screen, and it is the row QAT colours against min and max:'},
  {t:'table',head:['Colour','Status'],rows:[
   ['Dark red','Stocked out'],['Orange','Below minimum'],['Green','Stocked to plan'],
   ['Amber','Above maximum'],['Grey','Not available — usually a missing AMC']
  ]},
  {t:'note',b:'Interpreting an N/A value',c:'An N/A months of stock means QAT could not compute an AMC. The product is not fine and it is not understocked; you simply cannot tell, and no shipment will be suggested either.'}
 ],
 exercises:[
  {type:'num', tag:'Calculate',
   q:'Consumption for the AMC window reads: 4,200 / no data / 4,500 / 4,400 / 4,300 / 4,600. Using QAT\u2019s treatment of missing months, what is the AMC?',
   answer:4400, tol:1, unit:'packs / month',
   hint:'The month with no data is null, not zero. Divide by the number of months that actually have data.',
   explain:'The five months with data total 22,000, so the AMC is 4,400. Had the blank been treated as zero, the average would have dropped to 3,667 — about 17% lower, and every order sized from it would have been short.'},
  {type:'num', tag:'Calculate',
   q:'The ending balance for the month is 22,000 packs and the AMC is 4,400. What is the months of stock?',
   answer:5, tol:0.05, unit:'months',
   explain:'22,000 ÷ 4,400 = 5.0 months. It is the ending balance, not a mid-month snapshot, that QAT divides.'},
  {type:'mcq', tag:'Apply',
   q:'A planner raises the forecast for the next two months. Nothing else changes. What happens to this month\u2019s months of stock?',
   options:['Nothing, because the forecast is in the future','It falls, because the AMC window includes future months',
            'It rises, because higher demand means more stock is ordered','It is only recalculated after the month closes'],
   answer:1,
   explain:'The default window reaches two months forward, so a higher forecast lifts the AMC, and a higher AMC divided into the same balance gives fewer months of stock. The plan reacts before the demand arrives.'}
 ]
},
{
 id:'sp4', title:'Minimum, maximum and planning methods', minutes:10,
 body:[
  {t:'p',cls:'lede',c:'Minimum and maximum levels are the guardrails of the plan. The minimum is set per planning unit at the program level; the maximum is calculated, not typed.'},
  {t:'eq',c:'Max MOS = Min MOS + Reorder Interval',
   note:'The reorder interval is the number of months between shipments. A program with a min of 9 and an interval of 6 has a max of 15 — those are realistic numbers for a product shipped twice a year.'},
  {t:'h',c:'Plan by MOS, or plan by quantity'},
  {t:'p',c:'Not every product should be planned in months. QAT offers two methods, chosen per planning unit.'},
  {t:'table',head:['','Plan by MOS','Plan by quantity'],rows:[
   ['Suits','High-volume products, minimal expiry, shipments mostly replacing consumption','Low-volume, high-expiry products held for emergencies'],
   ['Examples','Most ACTs, ARVs, contraceptives, RDTs','Calcium gluconate for pre-eclampsia, anti-venom, severe malaria treatment in an elimination setting'],
   ['Minimum','Set in months of stock','Set as a quantity — e.g. 2 units per facility x 2,000 facilities'],
   ['Maximum','Min MOS + reorder interval','Min quantity + (reorder interval x AMC)'],
   ['Colour-coded row','Months of stock','Ending balance']
  ]},
  {t:'note',b:'Rationale for the two methods',c:'For an emergency product you might hold twelve months of stock and expect to discard most of it. Months of stock would read as overstocked every month and the colour would carry no information. A fixed quantity floor is the appropriate target.'},
  {t:'h',c:'Lead time segments'},
  {t:'p',c:'QAT maps lead time to the shipment lifecycle: planned to submitted, submitted to approved, approved to shipped, shipped to arrived by sea, shipped to arrived by air, and arrived to received. They are set per product, procurement agent, or program. Splitting them is what lets QAT judge whether a shipment date is physically achievable at all.'},
  {t:'widget',kind:'leadtime'}
 ],
 exercises:[
  {type:'num', tag:'Calculate',
   q:'A planning unit has a minimum of 9 months and a reorder interval of 6. What is the maximum?',
   answer:15, tol:0, unit:'months',
   explain:'9 + 6 = 15 months. A wide band like this is normal where a product arrives in two big shipments a year — the max has to accommodate a full interval of cover on arrival.'},
  {type:'num', tag:'Calculate',
   q:'A product is planned by quantity. The minimum is 4,000 units, the reorder interval is 2 months, and the AMC is 1,500 units per month. What is the maximum quantity?',
   answer:7000, tol:0, unit:'units',
   hint:'Min quantity + reorder interval x AMC.',
   explain:'4,000 + (2 x 1,500) = 7,000 units. The maximum moves whenever the AMC moves, even though the minimum is a fixed number.'},
  {type:'mcq', tag:'Judgement',
   q:'A country stocks anti-venom: low consumption, held at every district for emergencies, with most of it expiring unused. Which method fits?',
   options:['Plan by MOS, with a high minimum','Plan by quantity','Plan by MOS, with the reorder interval set to 12','Neither — exclude it from the supply plan'],
   answer:1,
   explain:'This is the textbook plan-by-quantity case: high stock relative to consumption, high expiry, and shipments replacing expired product rather than consumed product.'},
  {type:'seq', tag:'Sequence',
   q:'Put QAT\u2019s lead time segments in the order a shipment passes through them.',
   items:['Approved to shipped','Planned to submitted','Arrived to received','Submitted to approved','Shipped to arrived'],
   order:[1,3,0,4,2],
   explain:'Planned to submitted, submitted to approved, approved to shipped, shipped to arrived at port, arrived to received at destination.'}
 ]
},
{
 id:'sp5', title:'Shipments and their statuses', minutes:10,
 body:[
  {t:'p',cls:'lede',c:'A shipment is any planned or actual delivery into the supply chain, and it sits on the plan in the month it is expected to be received — not ordered, not shipped, not approved.'},
  {t:'p',c:'The shipments row shows one total per month. Expand it with the + sign and you get suggested shipments first, then a row per status, so you can see how firm the month actually is without opening anything.'},
  {t:'table',head:['Status','Meaning','In projections?'],rows:[
   ['Suggested','Generated by QAT as an early warning','No'],
   ['Planned','Entered manually, or a suggested shipment you accepted. Needs a procurement agent and funding source, which may be TBD','Yes'],
   ['Submitted','In a procurement system with an order number','Yes'],
   ['Approved','Approved by the procurement agent or funder','Yes'],
   ['Shipped','Left the supplier','Yes'],
   ['Arrived','At port of entry, in customs','Yes'],
   ['Received','At destination and ready to distribute','Yes'],
   ['On hold','In the system, awaiting a decision','Yes'],
   ['Cancelled','Placed, then cancelled','No']
  ]},
  {t:'note',b:'Statuses to verify',c:'On-hold shipments still count toward projected balances, even though nobody has committed to them moving. Cancelled ones drop out. If a plan looks healthier than you expect, expand the row and see what is sitting on hold.'},
  {t:'h',c:'Emergency shipments'},
  {t:'p',c:'A shipment is flagged as an emergency either because a user ticked the box, or because QAT did it automatically: the shipment is planned and its dates do not comply with the lead times. The second kind is the informative one. It is QAT saying the calendar does not permit what the plan claims.'},
  {t:'h',c:'Plan shipments by date'},
  {t:'p',c:'A calendar icon on both the shipment data entry and supply planning screens lets you plan shipments for one or several planning units to arrive in a specific month — campaign bednets every June, or lab reagents and consumables that have to land together. QAT applies the suggested-shipment logic to size each one up to max, and if a planning unit does not need a shipment that month it simply does not plan one.'},
  {t:'p',c:'Clicking a shipment cell opens a pop-up with the same columns as the data entry screen, scoped to one month and one planning unit, with a link through to the full screen. For bulk work, use data entry; for seeing the effect of a change immediately, edit here.'}
 ],
 exercises:[
  {type:'classify', tag:'Sort',
   q:'Which of these shipment statuses count toward projected stock balances?',
   buckets:[{id:'in',label:'Counts toward projections'},{id:'out',label:'Does not count'}],
   items:[
    {text:'Suggested',bucket:'out'},{text:'On hold',bucket:'in'},{text:'Planned',bucket:'in'},
    {text:'Cancelled',bucket:'out'},{text:'Arrived',bucket:'in'},{text:'Submitted',bucket:'in'}
   ],
   explain:'Only suggested and cancelled sit outside the projection. Everything else counts, including on hold — which is why a stalled order can mask a coming stockout.'},
  {type:'mcq', tag:'Recall',
   q:'What are the two ways a shipment gets flagged as an emergency?',
   options:['The funder requests it, or the quantity exceeds the maximum',
            'A user tags it, or QAT tags it automatically when a planned shipment does not comply with the lead times',
            'It is air-freighted, or it is locally procured',
            'It is above max, or it is below min'],
   answer:1,
   explain:'Manual tagging covers the cases you know about. The automatic flag is QAT checking your dates against the lead time segments and telling you the schedule is not achievable — worth acting on rather than dismissing.'},
  {type:'mcq', tag:'Apply',
   q:'An order was confirmed in January, ships in March, reaches port in April and clears customs in May. Which month should it sit in?',
   options:['January','March','April','May'],
   answer:3,
   explain:'Expected receive date — when the stock is at destination and ready to distribute. Dating it earlier makes the pipeline look healthy months before anything can be issued.'},
  {type:'mcq', tag:'Judgement',
   q:'A country receives campaign bednets every June and wants shipments for eight planning units all timed to that month. What is built for this?',
   options:['Enter eight planned shipments by hand','Plan shipments by date','A scenario','An equivalency unit'],
   answer:1,
   explain:'Plan shipments by date applies the suggested-shipment logic across the planning units you pick and sizes each to max for that month, skipping any that do not need one.'}
 ]
},
{
 id:'sp6', title:'Suggested shipments and replanning', minutes:11,
 body:[
  {t:'p',cls:'lede',c:'QAT proposes shipments on its own. They are an early warning, not an order — they do not affect stock projections, and they are not real until you change the status from blank.'},
  {t:'h',c:'Suggested shipment rules'},
  {t:'list',items:[
   'Is the planning unit below minimum for three straight months? If yes, suggest a shipment bringing the current month to maximum. If no, nothing.',
   'If it is stocked out, always suggest a shipment. If both of the next two months are below min, bring the month to maximum; if either is above min, bring it only to minimum.',
   'If AMC is zero or not available, no suggestion at all for that month.'
  ]},
  {t:'p',c:'Suggestions appear only for future months, and the quantity is placed in month N minus the distribution lead time — the month you would have to act, not the month the problem surfaces. If that lands inside the lead time, the suggestion comes pre-flagged as an emergency.'},
  {t:'widget',kind:'suggest'},
  {t:'h',c:'Recalculating a shipment quantity'},
  {t:'p',c:'When a planned shipment already sits in a future month and circumstances have changed, you do not have to delete it and start again. Right-click the quantity and choose Recalculate.'},
  {t:'eq',c:'Recalculated quantity = QAT suggested + current planned',
   note:'Available only for planned shipments in the future that have a QAT suggestion in the same month, with three months in a row under minimum. Everything else you already filled in — agent, receive date, data source — stays as it was.'},
  {t:'h',c:'Options when below minimum'},
  {t:'list',items:[
   'Convert a suggested shipment into a planned one.',
   'Expedite a shipment that is already planned.',
   'Re-plan the supply plan completely — by hand, or with the re-plan scenario.',
   'Do nothing, because the first three are not possible.'
  ]},
  {t:'note',b:'Planner judgement',c:'The suggestion exists to assist, not to decide. You are the planner, and the context — funding, freight, warehouse capacity, what the last shipment did — is not in the tool. Doing nothing is a legitimate choice as long as it is a choice.'}
 ],
 exercises:[
  {type:'mcq', tag:'Apply the rule',
   q:'A planning unit is stocked out in August. September is below minimum but October is above it. What does QAT suggest?',
   options:['No shipment, because only one of the next two months is below min','A shipment bringing August to maximum',
            'A shipment bringing August to minimum','A shipment bringing October to maximum'],
   answer:2,
   explain:'A stockout always triggers a suggestion. Because only one of the next two months is below minimum, QAT is conservative and tops up to minimum rather than maximum.'},
  {type:'mcq', tag:'Apply the rule',
   q:'A product has no consumption data in its AMC window, so AMC shows as N/A. Stock is projected to run out. What does QAT suggest?',
   options:['A shipment to maximum','A shipment to minimum','Nothing','An emergency shipment'],
   answer:2,
   explain:'With AMC zero or not available, QAT cannot size a suggestion and produces none. The months of stock will also show grey. The fix is the missing consumption data, not the shipment.'},
  {type:'num', tag:'Calculate',
   q:'A future month has a planned shipment of 11,000 and a QAT suggested shipment of 26,500 in the same month. You hit Recalculate. What quantity does QAT propose?',
   answer:37500, tol:0, unit:'units',
   hint:'The suggestion is what is needed on top of nothing; recalculate combines it with what is already planned.',
   explain:'26,500 + 11,000 = 37,500. Recalculate adds the suggestion to the existing planned quantity rather than replacing it, and leaves the agent, receive date and data source untouched.'},
  {type:'mcq', tag:'Judgement',
   q:'Your plan sits below minimum for four months and there is no money for a new order this year. What is the defensible move?',
   options:['Raise the AMC so the colour turns green','Lower the minimum until the months read as in-band',
            'Leave it, document why, and make sure whoever needs to know can see it',
            'Convert a suggested shipment anyway and let procurement sort it out'],
   answer:2,
   explain:'Taking no action is one of the four valid options, provided the decision and its reason are recorded. Adjusting the AMC or the minimum in order to change the stock status colour is not valid: it removes the signal for everyone who subsequently reviews the plan.'}
 ]
},
{
 id:'sp7', title:'Inventory, adjustments, expiry and unmet demand', minutes:11,
 body:[
  {t:'p',cls:'lede',c:'The ending balance is either something you counted or something QAT calculated. Knowing which, in which month, is most of what it takes to read a plan critically.'},
  {t:'eq',c:'Ending balance = inventory count where one exists, otherwise opening balance + shipments − consumption ± adjustments − projected expired stock',
   note:'An inventory count can only be entered for the current month or a past one. Adjustments can be entered in future months too.'},
  {t:'h',c:'Manual and automatic adjustments'},
  {t:'p',c:'Expand the adjustment row and it splits into three: the total, your manual adjustments, and automatic ones. Manual adjustments are losses, damages, expiries and transfers that you enter. QAT requires a note with each one. An adjustment recorded without a note cannot be distinguished from a data-entry error when the plan is reviewed.'},
  {t:'p',c:'An automatic adjustment appears when you enter an inventory count that disagrees with what QAT projected. If the projection said 204,000 and you counted 203,000, QAT records the 1,000 difference as an auto-adjustment rather than silently overwriting its own arithmetic. You cannot override those.'},
  {t:'h',c:'Projected expired stock'},
  {t:'p',c:'QAT creates one batch per shipment, expiring at the receive date plus the planning unit\u2019s shelf life — which is the shelf life you set, not necessarily the manufacturer\u2019s date. From those batches it projects forward which stock will expire before it can be used, and subtracts it in that month. On the graph it appears as an orange triangle.'},
  {t:'widget',kind:'batches'},
  {t:'h',c:'Unmet demand'},
  {t:'p',c:'QAT never shows negative stock. Where demand exceeds what was there, the shortfall moves to the unmet demand row — the estimate of what would have been consumed if stock had been available. It appears in three situations:'},
  {t:'list',items:[
   'Forecast consumption exceeds the projected opening stock for the month.',
   'Actual consumption covers a period that included days of stockout.',
   'A negative manual adjustment is larger than the projected ending balance.'
  ]},
  {t:'p',c:'The second case has a specific arithmetic. If a facility reported 100 units consumed in a month with 10 days of stockout, then it consumed 100 over 20 days — five a day — and the ten missing days represent 50 units of demand that never got served.'},
  {t:'eq',c:'Unmet demand = days out of stock x (actual consumption ÷ days in stock)',
   note:'Which also means the true consumption rate was 150 for that month, not 100.'},
  {t:'widget',kind:'unmet'},
  {t:'note',b:'Reviewing unmet demand',c:'A plan with a tidy ending balance and a populated unmet demand row is not a healthy plan. It means demand was clipped to fit the stock that existed, and the AMC built on that clipped consumption will keep the order too small next time.'}
 ],
 exercises:[
  {type:'num', tag:'Calculate',
   q:'A facility reports 4,000 units consumed in a 30-day month, during which it was stocked out for 6 days. What is the unmet demand?',
   answer:1000, tol:5, unit:'units',
   hint:'Work out the daily rate over the days it actually had stock, then multiply by the days it did not.',
   explain:'24 days in stock, so 4,000 ÷ 24 = 166.7 a day. Six missing days x 166.7 = 1,000 units of unmet demand, and the real monthly rate was 5,000 rather than 4,000.'},
  {type:'plan', tag:'Work it through',
   q:'Fill in the ending balance for each month. Opening stock in January is 30,000 packs, with no adjustments and no expiries.',
   opening:30000,
   rows:[{m:'Jan',ship:0,cons:9500},{m:'Feb',ship:20000,cons:10200},{m:'Mar',ship:0,cons:9800}],
   explain:'January: 30,000 − 9,500 = 20,500. February: 20,500 + 20,000 − 10,200 = 30,300. March: 30,300 − 9,800 = 20,500. Each ending balance is the next month\u2019s opening balance, which is why one bad figure propagates through the whole horizon.'},
  {type:'mcq', tag:'Apply',
   q:'QAT projected an ending balance of 204,000. You enter an actual inventory count of 203,000. What does QAT do?',
   options:['Replaces the projection silently','Rejects the count as inconsistent',
            'Records a 1,000 auto-adjustment alongside your count','Adds 1,000 to unmet demand'],
   answer:2,
   explain:'The auto-adjustment is QAT keeping an audit trail of its own disagreement with reality. It is visible when you expand the adjustment row, and you cannot edit it — the way to change it is to fix whatever upstream record caused the gap.'},
  {type:'mcq', tag:'Recall',
   q:'You want to record an inventory count for three months from now. Can you?',
   options:['Yes, inventory can be entered for any month','No — inventory is limited to the current or a past month',
            'Only if there is no shipment that month','Only with a note attached'],
   answer:1,
   explain:'You cannot count stock you do not have yet. Adjustments are allowed in future months, because a known future loss or transfer is a legitimate planning assumption, but an inventory record is an observation and observations are about the past.'}
 ]
},
{
 id:'sp8', title:'Scenario planning and the supply plan report', minutes:10,
 body:[
  {t:'p',cls:'lede',c:'Scenario planning lets you change one assumption and see what it does, without touching your plan until you choose to.'},
  {t:'p',c:'You can stack several scenarios, view the result, then apply them — creating a new version — or cancel out.'},
  {t:'table',head:['Scenario','What it does'],rows:[
   ['Increase or decrease forecast consumption','A percentage change across a chosen period'],
   ['Phase a product in or out','Interpolates a straight line between a start and end value'],
   ['Remove unfunded shipments','Drops every shipment whose funding source is still TBD'],
   ['Remove planned shipments','All of them, or only those breaking the lead times'],
   ['Remove submitted or on-hold shipments outside lead time','Drops orders whose dates are not achievable'],
   ['Re-plan','Removes planned shipments not holding stock between min and max, and generates new ones using the suggested-shipment logic']
  ]},
  {t:'widget',kind:'scenario'},
  {t:'h',c:'The supply plan report'},
  {t:'p',c:'The report is the version you show other people, and it comes in three views: a single program with shipments split by status; several programs sharing a planning unit, with shipments split by program and a consensus consumption row; and an equivalency unit view that aggregates across pack sizes and strengths.'},
  {t:'widget',kind:'eu'},
  {t:'note',b:'Using scenarios in review meetings',c:'"Here is what happens if that shipment slips two months" is a far better argument with a curve attached. That is what the scenarios are for.'}
 ],
 exercises:[
  {type:'mcq', tag:'Judgement',
   q:'Half of the future shipments have a funding source of TBD and the plan appears adequate. Which scenario tests the plan without them?',
   options:['Increase forecast consumption by 20%','Remove unfunded shipments','Re-plan','Phase the product out'],
   answer:1,
   explain:'It shows you the plan you can actually count on. If it holds without them you have slack; if it collapses, funding is your real risk rather than demand.'},
  {type:'mcq', tag:'Recall',
   q:'You want one national curve across three different pack sizes of the same product. What do you need?',
   options:['An alternate reporting unit','An equivalency unit','A multi-region program','A new realm'],
   answer:1,
   explain:'Equivalency units and their conversion factors are what make different planning units aggregable. ARUs cannot be combined with EUs.'},
  {type:'mcq', tag:'Apply',
   q:'Your planned shipments are holding stock well above max for most of the year. Which scenario rebuilds them?',
   options:['Remove unfunded shipments','Increase forecast consumption','Re-plan','Plan shipments by date'],
   answer:2,
   explain:'Re-plan strips out planned shipments that are not keeping stock between min and max and regenerates them from the suggested-shipment logic — the automatic version of the manual re-planning you would otherwise do shipment by shipment.'}
 ]
}
];

const TRACKS = [
 {id:'fc', title:'Forecasting', blurb:'How QAT is organised, the four units, trees and extrapolation, and how forecast error is measured.', lessons:FC},
 {id:'sp', title:'Supply planning', blurb:'Reading the screen and the graph, AMC and MOS, min and max, shipments, suggestions, adjustments, expiry and scenarios.', lessons:SP}
];

/* ============================ glossary ============================ */
const GLOSSARY = [
 ['AMC','Average monthly consumption. A dynamic value recalculated each month. The QAT default averages the 3 previous months, the current month and 2 future months; missing months are null, not zero. Administrators can widen the window to 12 months either side.'],
 ['ARU — alternate reporting unit','The product and unit a country actually reports consumption or stock in, with a multiplier to the planning unit. Report in boxes of 20 bottles and QAT converts to bottles.'],
 ['ARIMA','Auto-regressive integrated moving average. A time-series method for projecting consumption from historical trends and patterns.'],
 ['ARTMIS','GHSC-PSM\u2019s system for tracking procurement, shipping and delivery of USG-financed commodities. QAT integrates with it for shipment data.'],
 ['Batch','A quantity of product with a shared expiry date. QAT creates one batch per shipment, expiring at receive date plus shelf life.'],
 ['Consumption-based forecast','A forecast extrapolated from historical actual consumption using linear and non-linear methods.'],
 ['Continuous and discrete usage','On a forecasting tree, whether a product is used indefinitely or for a defined period. Discrete products need a period of use unless they are single use.'],
 ['Data source','Where a transactional record — consumption, inventory, adjustment, shipment — originated. Applied per record.'],
 ['Equivalency unit (EU)','A standardised unit converting different strengths or pack sizes into a common measure so they can be aggregated. Cannot be combined with ARUs.'],
 ['ERP linking','Integration with a procurement agent\u2019s order management system. Linked shipment fields are not editable inside QAT.'],
 ['FEFO','First expiry, first out. QAT\u2019s default batch logic for consumption. LEFO is the opposite and is discouraged.'],
 ['Forecasting unit (FU)','The smallest unit used when forecasting — tablets, tests, vials. Always smaller than or equal to the planning unit.'],
 ['Lead times','Mapped to the shipment lifecycle in six segments: planned to submitted, submitted to approved, approved to shipped, shipped to arrived by sea, shipped to arrived by air, and arrived to received.'],
 ['MAPE','Mean absolute percentage error. Averages each period\u2019s percentage error with equal weight.'],
 ['Master data sync','Standardised data shared across a realm. Syncs on online login or manual sync; full program data is a separate download and upload.'],
 ['Minimum and maximum stock levels','Minimum is set per planning unit at program level. Maximum is calculated as minimum plus the reorder interval.'],
 ['MOS — months of stock','Ending balance divided by AMC. Recalculated every month.'],
 ['PipeLine','The legacy supply planning tool QAT replaced. Supply plans lived in an Access database; ConvertPipelineToJson migrates them.'],
 ['Plan by MOS','For high-volume products with minimal expiry, where shipments mostly replace consumption. Min and max are expressed in months.'],
 ['Plan by quantity','For low-volume, high-expiry products held for emergencies. Min is a quantity; max is min plus reorder interval times AMC.'],
 ['Planning unit (PU)','The unit QAT plans and orders in — a bottle of 30 tablets, a 10x10 blister pack.'],
 ['Program','One country, one or more technical areas, one region, one organisation. The equivalent of a PipeLine supply plan database.'],
 ['PWA','Progressive web application. QAT works offline against a program you downloaded while online.'],
 ['QPL — QAT problem list','Flags data issues, inconsistencies and warnings affecting forecasts or supply plans.'],
 ['Quantimed','The legacy forecasting tool. QAT\u2019s forecasting module replaced its module 2.'],
 ['Realm','A set of shared master data — product catalogue, funders, procurement agents. The Global Health Realm is the one in use.'],
 ['Reorder interval','Months between shipments, default 1. Used to calculate the maximum.'],
 ['RMSE','Root mean squared error. In units, and penalises large misses disproportionately.'],
 ['Shipment','A planned or actual delivery into the supply chain, shown on the plan by expected receive date regardless of order status.'],
 ['Shipment statuses','Nine in total: suggested, planned, submitted, approved, shipped, arrived, received, on hold, cancelled. Suggested and cancelled are excluded from projections; on hold is included.'],
 ['Suggested shipment','An early warning generated by QAT when stock will fall below minimum. It does not affect projections until accepted and given another status.'],
 ['Technical area','Synonymous with commodity group — ARV, family planning, malaria. Used to define a program.'],
 ['Tree forecast','A flexible structure converting demographic, morbidity or service data into commodity quantities for products without usable consumption history.'],
 ['Tree template','A pre-defined forecasting tree that can be downloaded and customised to a country context.'],
 ['Triple exponential smoothing','Holt-Winters. Models level, trend and seasonality together — the method for seasonal commodities.'],
 ['Unmet demand','What would have been consumed had stock been available. QAT never shows negative stock; the shortfall goes in its own row.'],
 ['Usage template','Pre-defined rates of use for specific products, reusable across trees and programs.'],
 ['WAPE','Weighted absolute percentage error. Total absolute error as a share of total actual demand, so volume dominates.']
];

/* ============================ exam pool ============================ */
const EXAM = [
 {q:'What does QAT\u2019s default AMC window cover?',
  options:['The last 3 months','The last 6 months','3 months back, the current month, and 2 months forward','The last 12 months'],
  a:2, e:'Six months in total, reaching two months into the forecast. Administrators can extend it to 12 months either side.'},
 {q:'A month inside the AMC window has no consumption data. How is it treated?',
  options:['As zero','As null and excluded from the average','Replaced by the forecast','The AMC is not calculated at all'],
  a:1, e:'Null, not zero. Counting it as zero would understate the AMC and shrink every order built on it.'},
 {q:'How is the maximum stock level derived for a product planned by MOS?',
  options:['Typed in by the program administrator','Minimum plus the reorder interval','Twice the minimum','AMC times the lead time'],
  a:1, e:'Max MOS = min MOS + reorder interval. Only the minimum is set directly.'},
 {q:'Which two shipment statuses are excluded from projected balances?',
  options:['Planned and on hold','Suggested and cancelled','Submitted and approved','Arrived and received'],
  a:1, e:'Everything else counts, including on hold.'},
 {q:'A planning unit is stocked out, and both of the next two months are below minimum. What does QAT suggest?',
  options:['No shipment','A shipment bringing the month to minimum','A shipment bringing the month to maximum','An emergency shipment to twice the maximum'],
  a:2, e:'Stockout plus both following months below min means a top-up to maximum.'},
 {q:'Where does QAT place a suggested shipment quantity?',
  options:['In the month stock goes below minimum','In month N minus the distribution lead time','In the current month','In the first month of the plan'],
  a:1, e:'It appears in the month you would need to act, not the month the problem surfaces.'},
 {q:'A shipment\u2019s batch expiry date is calculated from what?',
  options:['The order date plus shelf life','The receive date plus shelf life','The supplier\u2019s stated expiry only','The end of the planning horizon'],
  a:1, e:'Receive date plus the planning unit\u2019s shelf life, and you can override it per batch.'},
 {q:'A positive manual adjustment is entered. Which batch gets it by default?',
  options:['The one expiring soonest','The one with the longest shelf life','The largest batch','It is split proportionally'],
  a:1, e:'Best-case logic sends positives to the longest shelf life and negatives to the soonest expiry.'},
 {q:'Which product profile calls for plan by quantity?',
  options:['A high-volume ACT with steady consumption','Anti-venom held at every district with high expiry','A contraceptive with a stable AMC','Any product with a long shelf life'],
  a:1, e:'Low consumption, high inventory relative to it, and shipments replacing expired rather than consumed product.'},
 {q:'A supply plan shows an unmet demand row with values in it. What does that mean?',
  options:['Stock went negative','Demand exceeded available stock and was clipped','The forecast was too low','Shipments were cancelled'],
  a:1, e:'QAT never shows negative stock. Unmet demand is what would have been consumed had stock been there.'},
 {q:'MOS is calculated as which of these?',
  options:['Opening balance divided by AMC','Ending balance divided by AMC','Ending balance divided by the forecast','AMC divided by ending balance'],
  a:1, e:'Ending balance ÷ AMC, recalculated each month.'},
 {q:'For a product planned by quantity, which row is colour-coded for stock status?',
  options:['Months of stock','Ending balance','Consumption','Shipments'],
  a:1, e:'Plan by MOS colours the months of stock row; plan by quantity colours the ending balance.'},
 {q:'Which scenario tests what the plan looks like without orders that have no money behind them?',
  options:['Re-plan supply plan','Remove unfunded shipments','Decrease forecast consumption','Phase product out'],
  a:1, e:'It drops every shipment whose funding source is still TBD.'},
 {q:'An alternate reporting unit has a multiplier of 20 and 340 units are reported. How many planning units is that?',
  options:['320','6,800','17','360'],
  a:1, e:'340 x 20 = 6,800 planning units.'},
 {q:'MAPE is much worse than WAPE for a forecast version. What does that suggest?',
  options:['The largest months were badly forecast','The errors are concentrated in low-volume months','The forecast is biased high throughout','The metrics were calculated on different periods'],
  a:1, e:'MAPE weights every month equally, so small months with large percentage errors dominate it. WAPE weights by volume.'},

function Chart(props){
  const html = chartSVG(props.opts);
  function onClick(e){
    const t = e.target.closest ? e.target.closest('[data-pick]') : null;
    if(t && props.onPick) props.onPick(+t.getAttribute('data-pick'));
  }
  return <div className="fig" onClick={onClick}>
    <div dangerouslySetInnerHTML={{__html:html}} />
    {props.cap ? <figcaption>{props.cap}</figcaption> : null}
  </div>;

function Shot({src, alt, zoomable}){
  const [big,setBig] = useState(false);
  useEffect(()=>{
    if(!big) return;
    const onKey = e => { if(e.key==='Escape') setBig(false); };
    window.addEventListener('keydown', onKey);
    return ()=> window.removeEventListener('keydown', onKey);
  }, [big]);
  return <React.Fragment>
    <button className="shot" onClick={()=>setBig(true)} aria-label="Enlarge screenshot">
      <img src={src} alt={alt||''} /></button>
    {big? <div className="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged screenshot"
        onClick={()=>setBig(false)}>
      <img src={src} alt={alt||''} />
      <button className="lbclose" aria-label="Close" onClick={()=>setBig(false)}>&times;</button>
      <p className="lbhint">Tap anywhere, or press Escape, to close</p>
    </div> : null}
  </React.Fragment>;
}

function Block(b){
  if(b.t==='p') return <p className={b.cls||''}>{b.c}</p>;
  if(b.t==='h') return <h2>{b.c}</h2>;
  if(b.t==='list') return <ul className="blist">{b.items.map((x,i)=><li key={i}>{x}</li>)}</ul>;
  if(b.t==='def') return <div className="defn"><b>{b.term}</b>{b.c}</div>;
  if(b.t==='note') return <div className="note"><b>{b.b}</b>{b.c}</div>;
  if(b.t==='eq') return <div className="eq">{b.c}{b.note?<small>{b.note}</small>:null}</div>;
  if(b.t==='table') return <table><thead><tr>{b.head.map((h,i)=><th key={i}>{h}</th>)}</tr></thead>
    <tbody>{b.rows.map((r,i)=><tr key={i}>{r.map((c,j)=><td key={j}>{c}</td>)}</tr>)}</tbody></table>;

}

/* ============================ scenario sandbox ============================ */
const BASE = {
  consumption:[9500,9800,10200,10500,11000,11500,12000,12000,11500,11000,10500,10000],
  opening:30000, min:3, reorder:2,
  shipments:[
    {m:3, qty:20000, status:'Planned', funding:'TBD'},
    {m:6, qty:25000, status:'Submitted', funding:'PMI'},
    {m:9, qty:20000, status:'Planned', funding:'Global Fund'}
  ]
};
function Sandbox(){
  const [pct,setPct] = useState(0);
  const [noUnfunded,setNoUnfunded] = useState(false);
  const [noPlanned,setNoPlanned] = useState(false);

  const build = (p, unf, pln) => {
    const cons = BASE.consumption.map(c => c*(1+p/100));
    const ship = new Array(12).fill(0);
    BASE.shipments.forEach(s=>{
      if(unf && s.funding==='TBD') return;
      if(pln && s.status==='Planned') return;
      ship[s.m] += s.qty;
    });
    return project({opening:BASE.opening, consumption:cons, shipments:ship,
      adjustments:null, min:BASE.min, reorder:BASE.reorder});
  };
  const rows = useMemo(()=>build(pct,noUnfunded,noPlanned),[pct,noUnfunded,noPlanned]);
  const base = useMemo(()=>build(0,false,false),[]);
  const mos = rows.map(r=> r.mos===null?0:r.mos);
  const ghost = base.map(r=> r.mos===null?0:r.mos);
  const max = BASE.min + BASE.reorder;
  const under = rows.filter(r=> r.mos!==null && r.mos>0 && r.mos<BASE.min).length;
  const over  = rows.filter(r=> r.mos!==null && r.mos>max).length;
  const out   = rows.filter(r=> r.close<=0).length;
  const unmet = rows.reduce((a,r)=>a+r.unmet,0);

  return <div className="sandbox">
    <h3>Scenario sandbox</h3>
    <p className="sub">One planning unit, twelve months. Opening stock 30,000. Min 3 MOS, reorder interval 2, so max is 5. Three shipments: 20,000 in April (planned, funding TBD), 25,000 in July (submitted, PMI), 20,000 in October (planned, Global Fund). The dashed line is the untouched baseline.</p>
    <Chart opts={{values:mos, ghost:ghost, min:BASE.min, max:max, top:10}}/>
    <div className="ctrl">
      <label>
        <span>Adjust forecast consumption</span>
        <input type="range" min="-40" max="40" step="5" value={pct}
          onChange={e=>setPct(+e.target.value)} />
        <span className="val">{pct>0?'+':''}{pct}%</span>
      </label>
    </div>
    <div className="toggles">
      <label><input type="checkbox" checked={noUnfunded} onChange={e=>setNoUnfunded(e.target.checked)} />
        <span>Remove unfunded shipments — drops the April order, funding source TBD</span></label>
      <label><input type="checkbox" checked={noPlanned} onChange={e=>setNoPlanned(e.target.checked)} />
        <span>Remove all planned shipments — drops April and October, leaving only the submitted July order</span></label>
    </div>
    <div className="readout">
      <div><span>Months below min</span><b>{under}</b></div>
      <div><span>Months above max</span><b>{over}</b></div>
      <div><span>Months stocked out</span><b>{out}</b></div>
      <div><span>Unmet demand</span><b>{nf(unmet)}</b></div>
    </div>
  </div>;
}

/* ============================ forecast error lab ============================ */
const ERR_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun'];
const ACTUAL =  [1200,1500, 900,1800, 400,1600];
const VER_A =   [1300,1400,1000,1700, 700,1500];
const VER_B =   [1250,1650, 850,2000, 420,1450];
function metrics(actual, fc, keep){
  let n=0, sumPct=0, sumAbs=0, sumAct=0, sumSq=0;
  actual.forEach((a,i)=>{
    if(!keep[i]) return;
    const err = Math.abs(fc[i]-a);
    n++; sumPct += err/a; sumAbs += err; sumAct += a; sumSq += err*err;
  });
  if(!n) return null;
  return {mape: sumPct/n*100, wape: sumAbs/sumAct*100, rmse: Math.sqrt(sumSq/n)};
}
function ErrorLab(){
  const [keep,setKeep] = useState([true,true,true,true,true,true]);
  const a = metrics(ACTUAL, VER_A, keep);
  const b = metrics(ACTUAL, VER_B, keep);
  const toggle = i => setKeep(k => k.map((v,j)=> j===i? !v : v));
  const line = (a && b)
    ? 'Version ' + (a.mape<=b.mape?'A':'B') + ' has the lower MAPE; version '
      + (a.wape<=b.wape?'A':'B') + ' has the lower WAPE'
      + (((a.mape<=b.mape) !== (a.wape<=b.wape))
         ? '. The two metrics disagree, which is why both are reported.'
         : '. Here they agree.')
    : 'Keep at least one month to calculate anything.';
  return <div className="sandbox">
    <h3>Forecast error lab</h3>
    <p className="sub">Six months of actuals against two forecast versions. May was a stockout month, so its actual is far below trend — click any month to exclude it and watch the metrics move.</p>
    <table className="plantable">
      <thead><tr><th>Month</th><th>Actual</th><th>Version A</th><th>Version B</th></tr></thead>
      <tbody>{ERR_MONTHS.map((m,i)=>
        <tr key={i} style={{opacity: keep[i]?1:0.4}}>
          <td><button className="mcell mtoggle" data-off={keep[i]?'0':'1'}
            style={{minWidth:'auto',padding:'3px 9px'}} onClick={()=>toggle(i)}>{m}</button></td>
          <td>{nf(ACTUAL[i])}</td><td>{nf(VER_A[i])}</td><td>{nf(VER_B[i])}</td>
        </tr>)}
      </tbody>
    </table>
    <div className="metrics">
      <div className="mbox" data-win={(a&&b&&a.wape<=b.wape)?'1':'0'}>
        <h5>Version A</h5>
        <div className="row"><span>MAPE</span>{a? a.mape.toFixed(1)+'%' : '—'}</div>
        <div className="row"><span>WAPE</span>{a? a.wape.toFixed(1)+'%' : '—'}</div>
        <div className="row"><span>RMSE</span>{a? nf(a.rmse) : '—'}</div>
      </div>
      <div className="mbox" data-win={(a&&b&&b.wape<a.wape)?'1':'0'}>
        <h5>Version B</h5>
        <div className="row"><span>MAPE</span>{b? b.mape.toFixed(1)+'%' : '—'}</div>
        <div className="row"><span>WAPE</span>{b? b.wape.toFixed(1)+'%' : '—'}</div>
        <div className="row"><span>RMSE</span>{b? nf(b.rmse) : '—'}</div>
      </div>
    </div>
    <p className="verdict">{line} The highlighted version has the lower WAPE.</p>
  </div>;
}

/* ============================ generic line chart ============================ */
function lineSVG(o){
  const W=660,H=250,L=46,R=12,T=16,B=32;
  const pw=W-L-R, ph=H-T-B;
  let all=[]; o.series.forEach(s=>s.values.forEach(v=>{ if(v!==null) all.push(v); }));
  const hi=Math.max.apply(null,all), lo=o.zero===false? Math.min.apply(null,all) : 0;
  const span=(hi-lo)||1;
  const n=o.labels.length;
  const x=i=>L+(pw/(n-1))*i;
  const y=v=>T+ph-((v-lo)/span)*ph;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(o.alt||'chart')+'">';
  for(let k=0;k<=4;k++){ const v=lo+span*k/4;
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--rule2)"/>';
    s+='<text class="axlabel" x="'+(L-7)+'" y="'+(y(v)+4)+'" text-anchor="end">'+nf(v)+'</text>'; }
  if(o.split!==undefined){
    s+='<line x1="'+x(o.split)+'" x2="'+x(o.split)+'" y1="'+T+'" y2="'+(T+ph)+'" stroke="var(--ink3)" stroke-dasharray="3 3"/>';
    s+='<text class="bandlabel" x="'+(x(o.split)+5)+'" y="'+(T+11)+'" fill="var(--ink3)">projection</text>';
  }
  o.series.forEach(se=>{
    let d='',open=false;
    se.values.forEach((v,i)=>{ if(v===null){open=false;return;}
      d += (open?'L':'M')+x(i)+','+y(v); open=true; });
    s+='<path d="'+d+'" fill="none" stroke="'+(se.color||'var(--ink)')+'" stroke-width="'+(se.w||2.2)+'"'
      + (se.dash?' stroke-dasharray="5 4"':'') + ' stroke-linejoin="round"/>';
    if(se.dots) se.values.forEach((v,i)=>{ if(v!==null)
      s+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="2.8" fill="'+(se.color||'var(--ink)')+'"/>'; });
  });
  o.labels.forEach((lb,i)=>{ if(lb)
    s+='<text class="mlabel" x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle">'+lb+'</text>'; });
  return s+'</svg>';
}
function Line(props){ return <div className="fig" dangerouslySetInnerHTML={{__html:lineSVG(props.opts)}} />; }

(function(){ for(let i=0;i<24;i++){
  const trend = 4000 + i*70;
  const noise = [1.02,0.97,1.04,0.99,1.01,0.96,1.03,1.00,0.98,1.05,0.99,1.02][i%12];
  HIST.push(Math.round(trend*SEASON[i%12]*noise));
}})();
function fitLinear(y){
  const n=y.length; let sx=0,sy=0,sxy=0,sxx=0;
  y.forEach((v,i)=>{ sx+=i; sy+=v; sxy+=i*v; sxx+=i*i; });
  const b=(n*sxy-sx*sy)/(n*sxx-sx*sx), a=(sy-b*sx)/n;
  return i=>a+b*i;
}
function ExtrapLab(){
  const [method,setMethod] = useState('season');
  const lin = fitLinear(HIST);
  // ratio-to-trend seasonal indices
  const idx = new Array(12).fill(0), cnt = new Array(12).fill(0);
  HIST.forEach((v,i)=>{ const t=lin(i); if(t>0){ idx[i%12]+=v/t; cnt[i%12]++; } });
  const si = idx.map((s,i)=> cnt[i]? s/cnt[i] : 1);
  const project = i => method==='linear' ? lin(i) : lin(i)*si[i%12];
  const fitted = HIST.map((v,i)=> project(i));
  const err = HIST.map((v,i)=> Math.abs(fitted[i]-v)/v).reduce((a,b)=>a+b,0)/HIST.length*100;
  const hist = HIST.concat(new Array(12).fill(null));
  const fwd = new Array(36).fill(null);
  for(let i=23;i<36;i++) fwd[i]=Math.round(project(i));
  return <div className="sandbox">
    <h3>Extrapolation visualiser</h3>
    <p className="sub">Two years of consumption with a clear rainy-season peak, projected twelve months forward. Same history, two methods.</p>
    <div className="seg">
      <button data-on={method==='linear'?'1':'0'} onClick={()=>setMethod('linear')}>Linear</button>
      <button data-on={method==='season'?'1':'0'} onClick={()=>setMethod('season')}>Seasonal (trend x index)</button>
    </div>
    <Line opts={{labels:HIST_LABELS, split:23, alt:'Consumption history and projection',
      series:[{values:hist, color:'var(--ink)', dots:false},
              {values:fwd, color:'var(--ok)', dash:true, w:2.4}]}}/>
    <div className="readout">
      <div><span>In-sample MAPE</span><b>{err.toFixed(1)}%</b></div>
      <div><span>Next 12 months</span><b>{nf(fwd.slice(24).reduce((a,b)=>a+b,0))}</b></div>
      <div><span>Peak month projected</span><b>{nf(Math.max.apply(null,fwd.slice(24)))}</b></div>
    </div>
    <p className="verdict">{method==='linear'
      ? 'Linear extrapolation approximates the annual average but not the seasonal shape. It under-supplies during the peak and over-supplies during the trough, while the annual total appears reasonable.'
      : 'Multiplying the trend by a seasonal index reproduces the peak. Note the lower in-sample error, and that the twelve-month total differs from the linear projection despite using the same history.'}</p>
  </div>;
}
