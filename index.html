<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supply planning in QAT — a self-paced module</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#F2F5F3;
  --card:#FFFFFF;
  --ink:#14312C;
  --ink2:#4E635E;
  --ink3:#7C8F8A;
  --rule:#D6DFDB;
  --under:#A63125;
  --low:#B4831C;
  --ok:#2E7A63;
  --over:#3C6398;
  --sans:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --serif:"Source Serif 4", Georgia, serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-size:17px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:var(--sans);cursor:pointer}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px;border-radius:2px}

.shell{max-width:1080px;margin:0 auto;padding:0 20px 80px}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:20;
  background:var(--paper);
  border-bottom:1px solid var(--rule);
  padding:14px 0 12px;
  margin-bottom:28px;
}
.top-in{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.wordmark{font-family:var(--sans);font-weight:700;letter-spacing:-.02em;font-size:18px}
.wordmark span{color:var(--ink3);font-weight:500}
.counter{margin-left:auto;font-family:var(--sans);font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.meter{height:3px;background:var(--rule);margin-top:10px;border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);width:0;transition:width .45s ease}

/* ---------- layout ---------- */
.grid{display:grid;gap:36px}
@media (min-width:880px){ .grid{grid-template-columns:200px 1fr;gap:48px} }

/* ---------- rail ---------- */
.rail{list-style:none;margin:0;padding:0;position:relative;font-family:var(--sans);font-size:14px}
@media (max-width:879px){
  .rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
}
.rail li{position:relative}
@media (min-width:880px){
  .rail li{padding:0 0 4px 24px}
  .rail li::before{content:"";position:absolute;left:4px;top:20px;bottom:-4px;width:1px;background:var(--rule)}
  .rail li:last-child::before{display:none}
}
.node{
  background:none;border:0;padding:6px 0;text-align:left;color:var(--ink3);
  font:inherit;width:100%;line-height:1.35;
}
@media (max-width:879px){
  .node{white-space:nowrap;padding:5px 11px;border:1px solid var(--rule);border-radius:999px;background:var(--card);width:auto;font-size:13px}
}
.dot{position:absolute;left:0;top:13px;width:9px;height:9px;border-radius:50%;background:var(--rule)}
@media (max-width:879px){ .dot{display:none} }
.node[data-state="done"]{color:var(--ink2)}
.node[data-state="done"] + .dot, li[data-state="done"] .dot{background:var(--ok)}
.node[data-state="now"]{color:var(--ink);font-weight:600}
li[data-state="now"] .dot{background:var(--ink);box-shadow:0 0 0 4px rgba(20,49,44,.12)}
.node:disabled{cursor:default}

/* ---------- lesson body ---------- */
.kicker{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ok);margin:0 0 6px}
h1{font-family:var(--sans);font-weight:700;letter-spacing:-.025em;line-height:1.1;margin:0 0 18px;font-size:34px}
h2{font-family:var(--sans);font-weight:600;letter-spacing:-.015em;font-size:20px;margin:30px 0 10px}
p{margin:0 0 15px;max-width:63ch}
.lede{font-size:19px;color:var(--ink2)}
em{font-style:italic}
strong{font-weight:600}

.defn{
  border-left:3px solid var(--ink);
  padding:2px 0 2px 16px;margin:20px 0;max-width:63ch;
}
.defn b{font-family:var(--sans);font-size:15px;display:block;margin-bottom:2px}

.eq{
  font-family:var(--sans);font-weight:500;font-size:16px;
  background:var(--card);border:1px solid var(--rule);border-radius:6px;
  padding:13px 16px;margin:18px 0;max-width:63ch;
  font-variant-numeric:tabular-nums;
}
.eq small{display:block;font-weight:400;color:var(--ink2);font-size:13.5px;margin-top:6px;font-family:var(--sans)}

table{border-collapse:collapse;font-family:var(--sans);font-size:15px;margin:18px 0;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--rule);padding:7px 18px 7px 0;text-align:left}
th{font-weight:600;font-size:13px;color:var(--ink2)}

.fig{margin:22px 0;max-width:640px}
.fig figcaption{font-family:var(--sans);font-size:13px;color:var(--ink2);margin-top:8px}
svg{display:block;width:100%;height:auto}

/* ---------- exercise ---------- */
.ex{
  background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:22px;margin:34px 0 0;max-width:660px;
}
.ex-tag{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink2);margin:0 0 10px}
.ex-q{font-family:var(--sans);font-size:16.5px;font-weight:500;line-height:1.45;margin:0 0 16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  font-size:15.5px;text-align:left;background:var(--paper);border:1px solid var(--rule);
  border-radius:7px;padding:11px 14px;color:var(--ink);line-height:1.4;
  transition:border-color .12s, background .12s;
}
.opt:hover:not(:disabled){border-color:var(--ink3)}
.opt[data-mark="right"]{border-color:var(--ok);background:rgba(46,122,99,.09);font-weight:600}
.opt[data-mark="wrong"]{border-color:var(--under);background:rgba(166,49,37,.07)}
.opt[data-mark="chosen"]{border-color:var(--ink);background:rgba(20,49,44,.06)}
.opt:disabled{cursor:default}

.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=text]{
  font-family:var(--sans);font-size:17px;font-variant-numeric:tabular-nums;
  padding:10px 12px;width:150px;border:1px solid var(--rule);border-radius:7px;
  background:var(--paper);color:var(--ink);
}
input[type=text]:focus{outline:2px solid var(--ok);outline-offset:0;border-color:transparent}
.unit{font-family:var(--sans);font-size:14px;color:var(--ink2)}

.btn{
  font-size:15px;font-weight:600;padding:10px 20px;border-radius:7px;border:1px solid var(--ink);
  background:var(--ink);color:#fff;
}
.btn:hover{background:#0d2520}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule);font-weight:500}
.btn.ghost:hover{border-color:var(--ink3);background:transparent}
.btn:disabled{opacity:.4;cursor:default}

.seq{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.seq .opt{display:flex;gap:12px;align-items:flex-start}
.seq .badge{
  font-family:var(--sans);font-weight:700;font-size:13px;min-width:20px;height:20px;
  border-radius:4px;background:var(--rule);color:var(--ink2);
  display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:1px;
}
.seq .badge.set{background:var(--ink);color:#fff}

.feedback{
  font-family:var(--sans);font-size:15px;line-height:1.5;margin-top:16px;
  padding-left:14px;border-left:3px solid var(--rule);
}
.feedback[data-tone="right"]{border-color:var(--ok)}
.feedback[data-tone="wrong"]{border-color:var(--low)}
.feedback b{display:block;margin-bottom:3px}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.hintline{font-family:var(--sans);font-size:14px;color:var(--ink2)}

.foot{display:flex;gap:12px;margin-top:32px;align-items:center;flex-wrap:wrap}

/* ---------- chart ---------- */
.mlabel{font-family:var(--sans);font-size:11px;fill:var(--ink3)}
.mlabel.sel{fill:var(--ink);font-weight:700}
.axlabel{font-family:var(--sans);font-size:11px;fill:var(--ink3)}
.bandlabel{font-family:var(--sans);font-size:10.5px;font-weight:600}
.hitbox{fill:transparent;cursor:pointer}
.hitbox:hover + .hitcol{fill:rgba(20,49,44,.06)}

/* ---------- start / done ---------- */
.hero h1{font-size:clamp(34px,6vw,52px);max-width:16ch}
.hero .lede{max-width:56ch}
.facts{list-style:none;padding:0;margin:26px 0 0;font-family:var(--sans);font-size:15px;max-width:60ch}
.facts li{padding:11px 0;border-top:1px solid var(--rule);display:flex;gap:14px}
.facts li span:first-child{color:var(--ink3);min-width:78px;flex:none}
.score{font-family:var(--sans);font-size:64px;font-weight:700;letter-spacing:-.04em;line-height:1;margin:0}
.score small{font-size:22px;color:var(--ink3);font-weight:500}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.5s .2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
</style>

<div class="top">
  <div class="shell" style="padding-bottom:0">
    <div class="top-in">
      <div class="wordmark">QAT <span>· supply planning basics</span></div>
      <div class="counter" id="counter"></div>
    </div>
    <div class="meter"><i id="meter"></i></div>
  </div>
</div>

<div class="shell">
  <div class="grid">
    <nav aria-label="Module contents"><ul class="rail" id="rail"></ul></nav>
    <main id="main" tabindex="-1"></main>
  </div>
</div>

<script>
/* ============================================================
   Stock-over-time chart. Used as the hero, as a figure, and as
   a clickable exercise. Values are months of stock (MOS).
   ============================================================ */
function chart(o){
  const v = o.values, months = o.months;
  const W = 640, H = 230, L = 34, R = 10, T = 14, B = 30;
  const pw = W - L - R, ph = H - T - B;
  const top = o.top || 10;
  const x = i => L + (pw / (v.length - 1)) * i;
  const y = m => T + ph - (Math.max(0, Math.min(top, m)) / top) * ph;
  const col = m => m < o.min ? 'var(--under)' : (m > o.max ? 'var(--over)' : 'var(--ok)');
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Months of stock by month">`;

  // max / min bands
  s += `<rect x="${L}" y="${T}" width="${pw}" height="${y(o.max) - T}" fill="rgba(60,99,152,.07)"/>`;
  s += `<rect x="${L}" y="${y(o.min)}" width="${pw}" height="${T + ph - y(o.min)}" fill="rgba(166,49,37,.07)"/>`;
  [[o.min,'min','var(--under)'],[o.max,'max','var(--over)']].forEach(([m,lab,c])=>{
    s += `<line x1="${L}" x2="${W-R}" y1="${y(m)}" y2="${y(m)}" stroke="${c}" stroke-width="1" stroke-dasharray="4 3"/>`;
    s += `<text class="bandlabel" x="${L+4}" y="${y(m)-5}" fill="${c}">${lab} ${m} MOS</text>`;
  });

  // y axis ticks
  for (let m = 0; m <= top; m += top/5){
    s += `<text class="axlabel" x="${L-7}" y="${y(m)+4}" text-anchor="end">${m}</text>`;
  }
  s += `<line x1="${L}" x2="${L}" y1="${T}" y2="${T+ph}" stroke="var(--rule)"/>`;
  s += `<line x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}" stroke="var(--rule)"/>`;

  // line
  const path = v.map((m,i)=>`${i?'L':'M'}${x(i)},${y(m)}`).join(' ');
  s += `<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2.25"
        stroke-linejoin="round" class="${o.animate?'draw':''}"/>`;

  // points + month labels + optional hit areas
  v.forEach((m,i)=>{
    const sel = o.selected === i, ans = o.reveal === i;
    if (o.pickable){
      const bw = pw / (v.length - 1);
      s += `<rect class="hitcol" x="${x(i)-bw/2}" y="${T}" width="${bw}" height="${ph}"
            fill="${sel||ans?'rgba(20,49,44,.08)':'transparent'}"/>`;
    }
    s += `<circle cx="${x(i)}" cy="${y(m)}" r="${sel||ans?5.5:3.5}"
          fill="${ans?'var(--ok)':(sel?'var(--ink)':col(m))}" stroke="var(--card)" stroke-width="1.5"/>`;
    s += `<text class="mlabel ${sel||ans?'sel':''}" x="${x(i)}" y="${H-10}" text-anchor="middle">${months[i]}</text>`;
    if (o.pickable){
      const bw = pw / (v.length - 1);
      s += `<rect class="hitbox" data-pick="${i}" x="${x(i)-bw/2}" y="${T}" width="${bw}" height="${ph}"
            role="button" tabindex="0" aria-label="${months[i]}"/>`;
    }
  });
  return s + `</svg>`;
}

/* ============================================================
   Content
   ============================================================ */
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DECLINE = [9.0,8.2,7.4,6.6,5.8,5.0,4.2,3.4,2.6,1.8,1.0,0.2];

const LESSONS = [
{
  short:'Where QAT fits',
  kicker:'Lesson 1 of 6',
  title:'Where QAT fits in quantification',
  body:`
    <p class="lede">QAT is a web-based tool for country-led forecasting and supply planning. It replaced
    PipeLine and Quantimed for most programs, and it does two jobs that used to live in two different files.</p>

    <p>The <strong>Forecasting module</strong> answers <em>how much will be needed</em>. You build one or more
    forecasts for a product — from consumption history, service data, morbidity estimates or a target-setting
    approach — and compare them before choosing one.</p>

    <p>The <strong>Supply Planning module</strong> answers <em>what do we already have, and when must the next
    shipment land</em>. It takes the chosen forecast as demand, sets it against stock on hand and shipments
    already in the pipeline, and walks the numbers forward month by month across the planning horizon.</p>

    <p>That second question is the one this module is about. Everything that follows — consumption, AMC,
    months of stock, min and max — is the arithmetic QAT runs under the supply plan.</p>

    <div class="defn"><b>Planning unit</b>
    The level at which QAT plans a product: a specific presentation and pack size, in the units you actually
    order and count. Forecasts may be built in tablets; plans are made in packs.</div>`,
  exercise:{
    type:'seq',
    q:'Put a quantification cycle back in order. Tap the four steps in the sequence a planner works through.',
    items:[
      'Set the procurement and delivery schedule with suppliers',
      'Forecast demand for each product',
      'Monitor stock status and revise the plan',
      'Build the supply plan against stock on hand and shipments'
    ],
    order:[1,3,0,2],
    explain:`Forecast first, then test that forecast against what is physically in the pipeline, then commit
    to orders and delivery dates, then keep revising. QAT covers the middle two directly and feeds the fourth
    every time new consumption and stock data arrive.`
  }
},
{
  short:'Plan inputs',
  kicker:'Lesson 2 of 6',
  title:'The four things a supply plan is made of',
  body:`
    <p>For every planning unit, in every month of the horizon, QAT wants four kinds of data. Nothing else
    moves the numbers.</p>

    <table>
      <tr><th>Input</th><th>What it is</th></tr>
      <tr><td>Stock on hand</td><td>A physical count at a point in time — the anchor the plan starts from</td></tr>
      <tr><td>Consumption</td><td>Actual issues where you have them, forecast where you don't</td></tr>
      <tr><td>Shipments</td><td>Quantities on order, each with an expected delivery date and a status</td></tr>
      <tr><td>Adjustments</td><td>Losses, expiries, damages, transfers in or out</td></tr>
    </table>

    <p>From those, QAT closes out each month and carries the balance into the next one:</p>

    <div class="eq">Closing stock = opening stock + shipments received − consumption ± adjustments
    <small>The closing balance of one month becomes the opening balance of the next.</small></div>

    <p>Two habits make or break a plan here. Enter shipments at the date they are <em>expected to arrive in
    country and be usable</em>, not the date the order was placed. And record adjustments honestly — a plan
    that ignores 8% annual losses will keep telling you that you have more than you do.</p>`,
  exercise:{
    type:'num',
    q:'A district opens June with 12,000 packs. A shipment of 20,000 packs arrives on 12 June. Consumption for the month is 9,500 packs, and 500 packs are written off as expired. What is the closing stock at the end of June?',
    answer:22000, tol:0, unit:'packs',
    hint:'Opening + received − consumption − losses.',
    explain:`12,000 + 20,000 − 9,500 − 500 = 22,000 packs. That 22,000 is what QAT carries into July as opening
    stock, which is why a single missed adjustment quietly distorts every month after it.`
  }
},
{
  short:'AMC',
  kicker:'Lesson 3 of 6',
  title:'Average monthly consumption',
  body:`
    <p>AMC is the rate at which a product moves. It is the denominator under almost every other number in the
    plan, so it is worth getting right.</p>

    <div class="eq">AMC = total consumption over the last n months ÷ n
    <small>QAT lets you choose n. Three to six months is common; longer smooths noise, shorter reacts faster.</small></div>

    <p>The choice of window is a judgement call about the product. A stable, high-volume commodity tolerates a
    long window. A product that just had a treatment guideline change or a campaign should use a short one, or
    the old regime will keep dragging the average up for a year.</p>

    <h2>Consumption is not demand</h2>

    <p>If a facility was stocked out for three weeks, it issued almost nothing — and the raw average now says
    demand is low, which triggers a smaller order, which causes the next stockout. Adjust for days out of
    stock before trusting an AMC, or at minimum flag the period and exclude it.</p>

    <div class="defn"><b>Watch for</b>
    A sharp drop in AMC that nobody can explain by season or policy is usually a data problem or a stockout,
    not a fall in demand.</div>`,
  exercise:{
    type:'num',
    q:'Consumption over the last three months was 4,200, 3,900 and 4,500 packs. Using a three-month window, what is the AMC?',
    answer:4200, tol:0, unit:'packs / month',
    hint:'Add the three months, divide by three.',
    explain:`(4,200 + 3,900 + 4,500) ÷ 3 = 4,200 packs per month. Now the caveat: if February's 3,900 covered
    two weeks of stockout, the true rate is higher than 4,200 and every order built on this number will be short.`
  }
},
{
  short:'Months of stock',
  kicker:'Lesson 4 of 6',
  title:'Months of stock, the common currency',
  body:`
    <p>Raw quantities can't be compared across products. Is 22,000 packs a lot? It depends entirely on how fast
    they move. Months of stock converts everything to the same unit: time.</p>

    <div class="eq">MOS = stock on hand ÷ AMC
    <small>"At the current rate of consumption, how long will this last?"</small></div>

    <p>That single conversion is what lets a planner look at forty products on one screen and know instantly
    which ones need attention. It is also what makes min and max levels portable — you set them once, in
    months, and they apply to a product moving 300 units a month and one moving 300,000.</p>

    <figure class="fig">
      ${chart({values:DECLINE, months:MO, min:3, max:6})}
      <figcaption>One planning unit across a year, with no shipment arriving. Green months sit between min and
      max; blue is above max; red is below min.</figcaption>
    </figure>

    <p>Read that curve the way QAT intends: not as a stock level, but as a countdown.</p>`,
  exercise:{
    type:'num',
    q:'The district holds 22,000 packs and the AMC is 4,400 packs per month. How many months of stock is that?',
    answer:5, tol:0.05, unit:'months',
    hint:'Stock on hand divided by AMC.',
    explain:`22,000 ÷ 4,400 = 5.0 months of stock. Against a min of 3 and a max of 6 months, this district is
    comfortably inside the band — no action needed this month.`
  }
},
{
  short:'Min, max, lead time',
  kicker:'Lesson 5 of 6',
  title:'Min, max, and when to place the order',
  body:`
    <p>Minimum and maximum stock levels are the guardrails of the plan, and both are expressed in months.</p>

    <div class="eq">Min = lead time + safety stock &nbsp;&nbsp;·&nbsp;&nbsp; Max = min + order interval
    <small>Below min you risk a stockout before the next delivery lands. Above max you risk expiry and tied-up cash.</small></div>

    <p>Lead time is the part planners most often underestimate. It is not the supplier's production time — it
    is everything from the moment an order is confirmed to the moment stock is usable in country: production,
    freight, customs, quality release, and onward distribution.</p>

    <h2>Order quantity</h2>

    <div class="eq">Order = (max × AMC) − stock on hand − stock already on order
    <small>Top the pipeline back up to max, counting what is already in transit.</small></div>

    <p>The chart below is the same declining curve, with a <strong>four-month lead time</strong> and a
    <strong>min of 3 MOS</strong>. Find the month where stock falls below min — then work backwards.</p>`,
  exercise:{
    type:'pick',
    q:'Stock crosses below the minimum at some point in this year. With a four-month lead time, which month is the latest you can place the order and still avoid going below min?',
    values:DECLINE, months:MO, min:3, max:6,
    answer:4,
    hint:'First find the month that drops under 3 MOS. Then count back four months.',
    explain:`Stock falls to 2.6 MOS in September, so the delivery has to be usable by then. Four months of lead
    time means the order must be placed in May. Order later and the lead time, not the planner, decides when
    the stockout happens.`
  }
},
{
  short:'Reading the plan',
  kicker:'Lesson 6 of 6',
  title:'Reading the output and acting on it',
  body:`
    <p>QAT colours every month of the horizon against that product's min and max. A finished plan is one you
    can scan in seconds, and the colours tell you which of four conversations to have.</p>

    <table>
      <tr><th>What you see</th><th>What it usually means</th></tr>
      <tr><td>Stockout months</td><td>Expedite an existing shipment, or borrow from another level</td></tr>
      <tr><td>Below min</td><td>Order sooner, or split an order into an earlier partial delivery</td></tr>
      <tr><td>Above max</td><td>Delay or reduce a shipment before it arrives, and check expiry dates</td></tr>
      <tr><td>Flat, tidy, in-band</td><td>Check the inputs are current before you believe it</td></tr>
    </table>

    <p>Overstock deserves more respect than it gets. It looks safe, so it rarely triggers action — but stock
    sitting above max for months is the leading indicator of an expiry write-off, and the write-off is what
    later shows up as an unexplained adjustment distorting someone's AMC.</p>

    <h2>Scenarios</h2>

    <p>QAT lets you copy a plan and change one assumption — a delayed shipment, a higher forecast, a shortened
    lead time — and compare the two. Use it before a meeting, not after: "here is what happens if that Q3
    delivery slips by two months" is a far better argument than a warning without a curve attached.</p>`,
  exercise:{
    type:'mcq',
    q:'A plan shows 9 to 10 months of stock from November through February against a max of 6 months, with a large shipment due to arrive in December. What is the most appropriate first action?',
    options:[
      'Leave it — being overstocked is safer than being understocked',
      'Reschedule the December shipment to a later month and check expiry dates on current stock',
      'Increase the AMC so the months of stock falls back inside the band',
      'Place a further order to keep the pipeline full'
    ],
    answer:1,
    explain:`Push the delivery back. The shipment hasn't arrived yet, so it is still moveable — and moving it
    is cheaper than storing stock you can't use before it expires. Changing the AMC to make the colour go green
    is the one genuinely wrong answer: the AMC describes reality, it isn't a dial for fixing the chart.`
  }
}
];

const QUIZ = [
{ type:'num',
  q:'A product has an AMC of 2,500 units per month and 15,000 units in stock. How many months of stock is that?',
  answer:6, tol:0.05, unit:'months',
  explain:'15,000 ÷ 2,500 = 6 months.' },
{ type:'mcq',
  q:'A facility was stocked out for most of March, and March consumption came in far lower than usual. What should the planner do with that month?',
  options:[
    'Include it — it is real consumption data',
    'Adjust for the days out of stock, or exclude the month from the AMC window',
    'Replace it with the forecast for March',
    'Lower the minimum stock level to match'
  ],
  answer:1,
  explain:'Stockout months understate demand. Left in the average, they shrink the AMC, shrink the next order, and cause the next stockout.' },
{ type:'num',
  q:'Max is 6 months, AMC is 4,400 packs per month, stock on hand is 22,000 packs and 3,000 packs are already on order. How much should be ordered?',
  answer:1400, tol:0, unit:'packs',
  explain:'(6 × 4,400) − 22,000 − 3,000 = 26,400 − 25,000 = 1,400 packs.' },
{ type:'mcq',
  q:'Which of these belongs in the minimum stock level?',
  options:['The order interval','Lead time plus safety stock','Average monthly consumption','Total stock on order'],
  answer:1,
  explain:'Min = lead time + safety stock. The order interval is what separates max from min.' },
{ type:'mcq',
  q:'A shipment was confirmed in January and is expected to clear customs and be usable in May. What date should be entered in the supply plan?',
  options:['January, when it was confirmed','The date it leaves the supplier','May, when it is expected to be usable','Whichever month is currently understocked'],
  answer:2,
  explain:'Plan on usable stock. Entering the order date makes the pipeline look healthy months before anything can actually be issued.' }
];

/* ============================================================
   State + render
   ============================================================ */
const S = { screen:'start', i:0, done:new Set(), ex:{}, qi:0, qAns:[], qState:null };
const main = document.getElementById('main');
const rail = document.getElementById('rail');
const TOTAL = LESSONS.length + 1;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = n => n.toLocaleString('en-US');

function progress(){
  const n = S.done.size;
  document.getElementById('meter').style.width = (n / TOTAL * 100) + '%';
  document.getElementById('counter').textContent =
    S.screen === 'start' ? '7 steps · about 25 minutes' : `${Math.min(n + (S.screen==='done'?0:1), TOTAL)} of ${TOTAL}`;
}

function renderRail(){
  if (S.screen === 'start'){ rail.innerHTML = ''; return; }
  const items = LESSONS.map((l,i)=>({label:l.short, i})).concat([{label:'Review quiz', i:LESSONS.length}]);
  rail.innerHTML = items.map(it=>{
    const cur = (S.screen==='lesson' && S.i===it.i) || (S.screen==='quiz' && it.i===LESSONS.length);
    const done = S.done.has(it.i);
    const state = cur ? 'now' : (done ? 'done' : 'todo');
    const can = done || cur;
    return `<li data-state="${state}"><span class="dot"></span>
      <button class="node" data-state="${state}" data-go="${it.i}" ${can?'':'disabled'}>${esc(it.label)}</button></li>`;
  }).join('');
  rail.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    const i = +b.dataset.go;
    if (i === LESSONS.length){ S.screen='quiz'; S.qi=0; S.qState=null; }
    else { S.screen='lesson'; S.i=i; }
    render();
  });
}

/* ---------- exercise rendering ---------- */
function exState(key){ return S.ex[key] || (S.ex[key] = {status:'open', pick:null, seq:[], tries:0}); }

function renderExercise(ex, key){
  const st = exState(key);
  const solved = st.status === 'right' || st.status === 'shown';
  let inner = '';

  if (ex.type === 'mcq'){
    inner = `<div class="opts">` + ex.options.map((o,i)=>{
      let mark = '';
      if (solved && i === ex.answer) mark = 'right';
      else if (st.status !== 'open' && i === st.pick) mark = 'wrong';
      return `<button class="opt" data-opt="${i}" ${solved?'disabled':''} ${mark?`data-mark="${mark}"`:''}>${esc(o)}</button>`;
    }).join('') + `</div>`;
  }

  if (ex.type === 'num'){
    inner = `<div class="numrow">
      <input type="text" inputmode="decimal" id="numin" placeholder="0" ${solved?'disabled':''}
        value="${st.pick ?? ''}" aria-label="Your answer">
      <span class="unit">${esc(ex.unit)}</span>
      ${solved?'':'<button class="btn" id="check">Check answer</button>'}
    </div>`;
  }

  if (ex.type === 'seq'){
    inner = `<div class="seq">` + ex.items.map((it,i)=>{
      const pos = st.seq.indexOf(i);
      let mark = '';
      if (solved) mark = 'right';
      else if (pos > -1) mark = 'chosen';
      return `<button class="opt" data-seq="${i}" ${solved?'disabled':''} ${mark?`data-mark="${mark}"`:''}>
        <span class="badge ${pos>-1||solved?'set':''}">${solved ? ex.order.indexOf(i)+1 : (pos>-1?pos+1:'')}</span>
        <span>${esc(it)}</span></button>`;
    }).join('') + `</div>
    <div class="actions" style="margin-top:0">
      ${solved?'':`<button class="btn" id="check" ${st.seq.length<ex.items.length?'disabled':''}>Check order</button>
      <button class="btn ghost" id="reset">Clear</button>`}
    </div>`;
  }

  if (ex.type === 'pick'){
    inner = `<div class="fig" style="margin:0 0 14px">${chart({
      values:ex.values, months:ex.months, min:ex.min, max:ex.max,
      selected: solved ? null : st.pick, reveal: solved ? ex.answer : null, pickable: !solved
    })}</div>
    ${solved?'':`<div class="actions" style="margin-top:0">
      <button class="btn" id="check" ${st.pick===null?'disabled':''}>Check answer</button>
      <span class="hintline">${st.pick===null?'Tap a month on the chart':'Selected: '+ex.months[st.pick]}</span>
    </div>`}`;
  }

  let fb = '';
  if (st.status === 'wrong'){
    fb = `<div class="feedback" data-tone="wrong"><b>Not right yet.</b>${
      st.tries >= 2 ? esc(ex.hint || 'Have another look at the section above.') + ' Or reveal the answer below.'
                    : esc(ex.hint || 'Have another read of the section above, then try again.')}</div>`;
  }
  if (solved){
    fb = `<div class="feedback" data-tone="right"><b>${st.status==='right'?'Correct.':'Here it is.'}</b>${esc(ex.explain)}</div>`;
  }

  const showReveal = st.status === 'wrong' && st.tries >= 2;

  return `<section class="ex">
    <p class="ex-tag">Check yourself</p>
    <p class="ex-q">${esc(ex.q)}</p>
    ${inner}
    ${fb}
    ${showReveal?`<div class="actions"><button class="btn ghost" id="reveal">Show me the answer</button></div>`:''}
  </section>`;
}

function wireExercise(ex, key){
  const st = exState(key);
  const fin = ok => { st.status = ok ? 'right' : 'wrong'; if(!ok) st.tries++; render(true); };

  main.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{
    st.pick = +b.dataset.opt; fin(st.pick === ex.answer);
  });
  main.querySelectorAll('[data-seq]').forEach(b=>b.onclick=()=>{
    const i = +b.dataset.seq;
    if (st.seq.includes(i)) st.seq = st.seq.filter(x=>x!==i); else st.seq.push(i);
    render(true);
  });
  main.querySelectorAll('[data-pick]').forEach(r=>{
    const go = ()=>{ st.pick = +r.dataset.pick; render(true); };
    r.onclick = go;
    r.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } };
  });
  const reset = main.querySelector('#reset');
  if (reset) reset.onclick = ()=>{ st.seq = []; render(true); };
  const reveal = main.querySelector('#reveal');
  if (reveal) reveal.onclick = ()=>{ st.status = 'shown'; render(true); };

  const check = main.querySelector('#check');
  if (check) check.onclick = ()=>{
    if (ex.type === 'num'){
      const raw = (main.querySelector('#numin').value || '').replace(/[, ]/g,'');
      st.pick = raw;
      const val = parseFloat(raw);
      fin(!isNaN(val) && Math.abs(val - ex.answer) <= (ex.tol ?? 0));
    } else if (ex.type === 'seq'){
      fin(st.seq.length === ex.order.length && st.seq.every((v,i)=>v === ex.order[i]));
    } else if (ex.type === 'pick'){
      fin(st.pick === ex.answer);
    }
  };
  const inp = main.querySelector('#numin');
  if (inp) inp.onkeydown = e => { if (e.key === 'Enter' && check) check.click(); };
}

/* ---------- screens ---------- */
function renderStart(){
  main.innerHTML = `<div class="hero">
    <p class="kicker">Self-paced · no account needed</p>
    <h1>Supply planning in QAT</h1>
    <p class="lede">Six short lessons on the logic behind the Quantification Analytics Tool — consumption,
    average monthly consumption, months of stock, and the min and max levels that decide when you order.
    Every lesson ends with something to work out yourself.</p>
    <figure class="fig">${chart({values:DECLINE, months:MO, min:3, max:6, animate:true})}</figure>
    <ul class="facts">
      <li><span>Built for</span><span>Planners, MOH staff and students new to quantification</span></li>
      <li><span>You need</span><span>No prior QAT access — a calculator helps</span></li>
      <li><span>Ends with</span><span>A five-question scored review</span></li>
    </ul>
    <div class="foot"><button class="btn" id="go">Start lesson 1</button></div>
  </div>`;
  main.querySelector('#go').onclick = ()=>{ S.screen='lesson'; S.i=0; render(); };
}

function renderLesson(){
  const l = LESSONS[S.i];
  const key = 'l' + S.i;
  const st = exState(key);
  const solved = st.status === 'right' || st.status === 'shown';
  main.innerHTML = `
    <p class="kicker">${esc(l.kicker)}</p>
    <h1>${esc(l.title)}</h1>
    ${l.body}
    ${renderExercise(l.exercise, key)}
    <div class="foot">
      ${S.i>0?`<button class="btn ghost" id="prev">Back</button>`:''}
      <button class="btn" id="next" ${solved?'':'disabled'}>
        ${S.i < LESSONS.length-1 ? 'Next lesson' : 'Go to the review quiz'}</button>
      ${solved?'':`<span class="hintline">Answer the question to continue</span>`}
    </div>`;
  wireExercise(l.exercise, key);
  const prev = main.querySelector('#prev');
  if (prev) prev.onclick = ()=>{ S.i--; render(); };
  main.querySelector('#next').onclick = ()=>{
    S.done.add(S.i);
    if (S.i < LESSONS.length-1){ S.i++; S.screen='lesson'; }
    else { S.screen='quiz'; S.qi=0; S.qState=null; }
    render();
  };
}

function renderQuiz(){
  const q = QUIZ[S.qi];
  const answered = S.qState !== null;
  let inner = '';
  if (q.type === 'mcq'){
    inner = `<div class="opts">` + q.options.map((o,i)=>{
      let mark = '';
      if (answered && i === q.answer) mark = 'right';
      else if (answered && i === S.qState.pick) mark = 'wrong';
      return `<button class="opt" data-opt="${i}" ${answered?'disabled':''} ${mark?`data-mark="${mark}"`:''}>${esc(o)}</button>`;
    }).join('') + `</div>`;
  } else {
    inner = `<div class="numrow">
      <input type="text" inputmode="decimal" id="numin" placeholder="0" ${answered?'disabled':''}
        value="${answered?esc(S.qState.pick):''}" aria-label="Your answer">
      <span class="unit">${esc(q.unit)}</span>
      ${answered?'':'<button class="btn" id="check">Submit</button>'}
    </div>`;
  }

  main.innerHTML = `
    <p class="kicker">Review · question ${S.qi+1} of ${QUIZ.length}</p>
    <h1 style="font-size:26px;max-width:24ch">Let's see what stuck.</h1>
    <section class="ex">
      <p class="ex-tag">Scored — one attempt each</p>
      <p class="ex-q">${esc(q.q)}</p>
      ${inner}
      ${answered?`<div class="feedback" data-tone="${S.qState.ok?'right':'wrong'}">
        <b>${S.qState.ok?'Correct.':'Not this time.'}</b>${esc(q.explain)}</div>`:''}
    </section>
    <div class="foot">
      <button class="btn" id="next" ${answered?'':'disabled'}>
        ${S.qi < QUIZ.length-1 ? 'Next question' : 'See my score'}</button>
    </div>`;

  main.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{
    const pick = +b.dataset.opt;
    S.qState = {pick, ok: pick === q.answer};
    S.qAns[S.qi] = S.qState.ok; render(true);
  });
  const check = main.querySelector('#check');
  if (check) check.onclick = ()=>{
    const raw = (main.querySelector('#numin').value || '').replace(/[, ]/g,'');
    const val = parseFloat(raw);
    const ok = !isNaN(val) && Math.abs(val - q.answer) <= (q.tol ?? 0);
    S.qState = {pick: raw, ok};
    S.qAns[S.qi] = ok; render(true);
  };
  const inp = main.querySelector('#numin');
  if (inp) inp.onkeydown = e => { if (e.key === 'Enter' && check) check.click(); };
  main.querySelector('#next').onclick = ()=>{
    if (S.qi < QUIZ.length-1){ S.qi++; S.qState=null; }
    else { S.done.add(LESSONS.length); S.screen='done'; }
    render();
  };
}

function renderDone(){
  const score = S.qAns.filter(Boolean).length;
  const note = score === QUIZ.length
    ? 'Nothing left to fix. Take this into a real plan and the arithmetic will look familiar.'
    : score >= 3
      ? 'Solid. Worth a second pass on the questions you missed before you plan for real.'
      : 'The maths is quick once the vocabulary settles — the lessons are still open in the sidebar.';
  main.innerHTML = `
    <p class="kicker">Module complete</p>
    <p class="score">${score}<small> / ${QUIZ.length}</small></p>
    <h1 style="font-size:28px;margin-top:14px;max-width:22ch">You've finished supply planning basics.</h1>
    <p class="lede">${esc(note)}</p>
    <p>You can now read a QAT supply plan and say why a month is red: whether it's the AMC, the lead time, the
    min level, or a shipment dated when it was ordered rather than when it lands.</p>
    <h2>Where to go next</h2>
    <p>The natural follow-on topics are the forecasting module — extrapolation methods, comparing forecast
    versions, and measuring forecast error — and scenario planning for shipment delays.</p>
    <div class="foot">
      <button class="btn ghost" id="again">Retake the quiz</button>
      <button class="btn ghost" id="restart">Start over</button>
    </div>`;
  main.querySelector('#again').onclick = ()=>{ S.qi=0; S.qAns=[]; S.qState=null; S.screen='quiz'; render(); };
  main.querySelector('#restart').onclick = ()=>{
    S.screen='start'; S.i=0; S.done=new Set(); S.ex={}; S.qi=0; S.qAns=[]; S.qState=null; render();
  };
}

function render(keepScroll){
  const y = window.scrollY;
  if (S.screen === 'start') renderStart();
  else if (S.screen === 'lesson') renderLesson();
  else if (S.screen === 'quiz') renderQuiz();
  else renderDone();
  renderRail();
  progress();
  if (keepScroll) window.scrollTo(0, y);
  else window.scrollTo(0, 0);
}

render();
</script>
